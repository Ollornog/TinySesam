# Exceptions to the CVE scan of the gateway image (release.yml, job `image-probe`; H1, ASVS 15.2.1).
#
# The scan fails on every fixable finding of severity high or above. An exception belongs here only when the fix
# cannot be shipped within the deadline of SECURITY.md ("Vulnerable dependencies") — typically: the fixed OS package
# is in Debian, but the pinned python:*-slim digest has not been rebuilt yet, and a rebuild with `apt-get upgrade`
# would cost the reproducible build (B4-7/B4-8).
#
# Every rule: `reason` begins with "until YYYY-MM-DD:" (at most 31 days ahead), then why it is acceptable meanwhile.
# scripts/_grype_exceptions.py enforces both before the scan; after the date the scan is red again.
# Remove a rule as soon as Dependabot's digest bump carries the fix.
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: zlib1g
      type: deb
    reason: "until 2026-12-07: heap overflow in gzwrite() after a failed write() — the gateway's Python uses zlib's
      deflate/inflate only (no gzFile I/O). Fixed in Debian 1:1.3.dfsg+really1.3.1-1+deb13u1 (2026-11-07); the
      pinned python:3.15-slim digest (built 2026-11-05) still carries -1+b1."
