[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysesam"
version = "0.18.0"
# Die Kurzbeschreibung steht im Paketindex neben dem Namen — englisch wie README und Website.
description = "Small, reusable multi-method authentication for FastAPI: password, PIN, passkey, OIDC, SAML, LDAP, TOTP, magic link, forward-auth"
readme = "README.md"
requires-python = ">=3.10"
# Bewusst die Tabellenform statt des SPDX-Ausdrucks aus PEP 639: der verlangt setuptools>=77,
# und gebaut wird auch mit älteren (das CI-Abbild bringt 68 mit). Umstellen, sobald überall
# eine neuere Fassung liegt — dann `license = "MIT"` + `license-files = ["LICENSE"]`.
license = { text = "MIT" }
authors = [{ name = "ollornog" }]
keywords = ["fastapi", "authentication", "auth", "oidc", "webauthn", "passkey", "totp", "2fa",
            "magic-link", "forward-auth", "sso", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    # Jede hier genannte Fassung wird von der CI auch gefahren — `tests/test_packaging.py`
    # hält beides zusammen. Ein Classifier ist ein Versprechen, keine Hoffnung.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
# Die Untergrenzen sind KEIN „läuft vermutlich auch damit" — sie sind der gemessene Boden
# ohne bekannte Lücke (OSV, Stand 2026-09-22). Ein `>=` ohne Deckel ist eine Zusage: Wer eine
# alte Fassung festhält (Lockfile, Constraints, Distributionspaket), bekommt eine unterstützte
# Installation. Lag der Boden unter einem Sicherheitsfix, war die Zusage falsch — so zog die
# niedrigste erlaubte Auflösung bis 0.18.0 authlib 1.3.0, python-multipart 0.0.9 und (über
# FastAPI) starlette 0.36.3, alle drei mit offenen Advisories. Gehoben wird der Boden,
# **keine obere Schranke** ergänzt: Ein Deckel in einer Bibliothek blockiert genau die
# Aktualisierung, die den nächsten Fix bringt. `tests/test_packaging.py` misst die Grenzen
# gegen eine Tabelle mit, damit der Boden nicht wieder altert (B4-1 aus T-13).
dependencies = [
    # 0.133.0 ist die erste Fassung, die starlette >= 1.3.1 zulässt (Host-Header-Prüfung,
    # UNC-Pfade in StaticFiles, Methoden-Dispatch, form()-Grenzen).
    "fastapi>=0.133.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23"]        # sonst stdlib-scrypt-Fallback
qr = ["qrcode[pil]>=7"]             # TOTP-Enrollment-QR
oidc = ["httpx>=0.27", "authlib>=1.6.12"]
passkey = ["webauthn>=2.0"]
ldap = ["ldap3>=2.9"]
redis = ["redis>=5"]
saml = ["python3-saml>=1.15"]       # braucht System-libxmlsec1
# Das Forward-Auth-Gateway als fertiger Dienst: OIDC + ein ASGI-Server. `[oidc]` allein reicht
# NICHT — `python -m tinysesam.gateway` endete damit in einem ModuleNotFoundError für uvicorn,
# und genau das stand als Startbefehl in der README.
gateway = ["httpx>=0.27", "authlib>=1.6.12", "uvicorn>=0.30"]
all = ["argon2-cffi>=23", "qrcode[pil]>=7", "httpx>=0.27", "authlib>=1.6.12", "webauthn>=2.0",
       "ldap3>=2.9", "redis>=5", "python3-saml>=1.15", "uvicorn>=0.30"]

# Die Leiste neben der Projektseite im Index. Wer dort landet, sucht meist eines von
# fünf Zielen — fehlt eines, sucht er es auf GitHub und findet vielleicht ein anderes Projekt.
[project.urls]
Homepage = "https://ollornog.github.io/TinySesam/"
Documentation = "https://ollornog.github.io/TinySesam/"
Repository = "https://github.com/Ollornog/TinySesam"
Changelog = "https://github.com/Ollornog/TinySesam/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ollornog/TinySesam/issues"

[project.scripts]
tinysesam = "tinysesam.__main__:main"

[tool.setuptools.packages.find]
include = ["tinysesam*"]

# Alles, was NICHT `.py` ist und trotzdem zur Laufzeit gebraucht wird, muss hier stehen —
# sonst fehlt es im Wheel und fällt erst beim Nutzer auf. `tests/test_packaging.py` prüft
# gegen die versionierten Dateien, damit die Liste nicht hinter dem Paket zurückbleibt.
[tool.setuptools.package-data]
tinysesam = ["py.typed"]
