[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysesam"
version = "0.25.0"
# The short description appears in the package index next to the name — English like the README and website.
description = "Small, reusable multi-method authentication for FastAPI: password, PIN, passkey, OIDC, SAML, LDAP, TOTP, magic link, forward-auth"
readme = "README.md"
requires-python = ">=3.13"
# SPDX expression per PEP 639 (T-7): setuptools no longer accepts the table form `{ text = "MIT" }`
# from 2027-02-18. Needs setuptools >= 77 — which has been in every build environment since 2026-09
# (CI image, GitHub jobs, isolated build). The license classifier is dropped:
# PEP 639 forbids it alongside the expression.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ollornog" }]
keywords = ["fastapi", "authentication", "auth", "oidc", "webauthn", "passkey", "totp", "2fa",
            "magic-link", "forward-auth", "sso", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    # Every version named here is also run by the CI — `tests/test_packaging.py`
    # keeps the two together. A classifier is a promise, not a hope.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
# The lower bounds are NOT "probably works with this too" — they are the measured floor
# without a known vulnerability (OSV, as of 2026-09-22). A `>=` without a cap is a promise: anyone who
# pins an old version (lockfile, constraints, distribution package) gets a supported
# installation. If the floor was below a security fix, the promise was false — so the
# lowest allowed resolution up to 0.18.0 pulled authlib 1.3.0, python-multipart 0.0.9 and (via
# FastAPI) starlette 0.36.3, all three with open advisories. The floor is raised,
# **no upper bound** is added: a cap in a library blocks exactly the
# update that brings the next fix. `tests/test_packaging.py` also measures the bounds
# against a table, so the floor does not age again (B4-1 from T-13).
dependencies = [
    # 0.133.0 is the first version that allows starlette >= 1.3.1 (Host-header check,
    # UNC paths in StaticFiles, method dispatch, form() limits).
    "fastapi>=0.133.0",
    # Required since 0.21.0: TOTP secrets are stored AES-256-GCM-encrypted in the database
    # (H-14/H-15). The standard library has no AES; rolling our own crypto would be the worse choice.
    "cryptography>=50.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
argon2 = ["argon2-cffi>=23"]        # otherwise stdlib scrypt fallback
qr = ["qrcode[pil]>=7"]             # TOTP enrollment QR
oidc = ["httpx>=0.27", "authlib>=1.9.1"]
passkey = ["webauthn>=2.0"]
ldap = ["ldap3>=2.9"]
redis = ["redis>=5"]
saml = ["python3-saml>=1.15"]       # needs system libxmlsec1
# The forward-auth gateway as a ready-made service: OIDC + an ASGI server. `[oidc]` alone is
# NOT enough — `python -m tinysesam.gateway` ended with a ModuleNotFoundError for uvicorn,
# and that was exactly the start command in the README.
gateway = ["httpx>=0.27", "authlib>=1.9.1", "uvicorn>=0.30"]
all = ["argon2-cffi>=23", "qrcode[pil]>=7", "httpx>=0.27", "authlib>=1.9.1", "webauthn>=2.0",
       "ldap3>=2.9", "redis>=5", "python3-saml>=1.15", "uvicorn>=0.30"]

# The sidebar next to the project page in the index. Whoever lands there usually looks for one of
# five targets — if one is missing, they search for it on GitHub and may find a different project.
[project.urls]
Homepage = "https://ollornog.github.io/TinySesam/"
Documentation = "https://ollornog.github.io/TinySesam/"
Repository = "https://github.com/Ollornog/TinySesam"
Changelog = "https://github.com/Ollornog/TinySesam/blob/main/CHANGELOG.md"
Issues = "https://github.com/Ollornog/TinySesam/issues"

[project.scripts]
tinysesam = "tinysesam.__main__:main"

[tool.setuptools.packages.find]
include = ["tinysesam*"]

# Everything that is NOT `.py` and is still needed at runtime must be listed here —
# otherwise it is missing from the wheel and only the user notices. `tests/test_packaging.py` checks
# against the versioned files, so the list does not fall behind the package.
[tool.setuptools.package-data]
tinysesam = ["py.typed"]
