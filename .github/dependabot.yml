# SHA-pinned actions go stale silently — a commit SHA does not say that a newer
# version exists. Dependabot reads the version comment behind the pin and opens
# a PR with the SHA of the new version. Without this file the SHA pinning would be a
# security gain paid for with maintenance blindness.
#
# Security updates for dependencies run separately through the repo switch
# (Dependabot security updates) and need no configuration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Several parts of ONE action (`github/codeql-action/init` and `/analyze`) must have the same
      # version: bumped singly, `init` stood at 4.38.2 and `analyze` at 4.38.1, and
      # CodeQL aborted ("Loaded a configuration file for version '4.38.2', but running version
      # '4.38.1'", #110/#111). That is why they are bumped together. `tests/test_repo.py` demands one
      # such group for every action that is used with several subpaths.
      codeql:
        patterns: ["github/codeql-action*"]

  # Pinned Python dependencies — where there ARE pins. Up to 0.19.0 there was an entry here for
  # `directory: /`, i.e. for the `>=` bounds in pyproject.toml. It could never do anything: an
  # open lower bound already allows every new version, Dependabot sees nothing to raise (B4-3
  # from T-13). The question whether a FLOOR is still free of known vulnerabilities is answered by the gate in
  # .github/workflows/audit.yml (resolution `lowest-direct` against pip-audit) — red instead of a PR.
  #
  # What is shipped or used for building, on the other hand, stands pinned with hashes, and there
  # Dependabot bumps the lines: the lock list of the gateway image, the build tools of wheel
  # and sdist, the tools of the vulnerability gate.
  #
  # The lock list of the gateway image has been maintained by the uv entry below since 2026-10-10: this pip entry bumped it
  # line by line and did not add new transitive dependencies (fastapi 0.142 → opentelemetry-api, #126 red).
  # The two tool lists stay here — they are called `tools.in`, and whether the uv ecosystem finds the output file for
  # them is not clear from the source (it looks for `<name>.txt` or the .in at the end of the header line).
    ignore:
      # The pin belongs to the repokit template (`tests/_kit/vorlage_actions.yml`), it arrives with `repokit sync`.
      # A bump here would deviate from the template, and the PR would never turn green (kit 0.36.0).
      - dependency-name: "actions/create-github-app-token"
  - package-ecosystem: pip
    directories: ["/.github/packaging", "/.github/audit"]
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # One PR per month instead of one per package — otherwise a solo project drowns in noise.
      #
      # **Only patch and minor.** Majors come singly: if one breaks, the red PR is attributable to exactly this
      # package, instead of holding up a collective PR with three harmless patches. Since
      # 2026-10-11 majors also merge themselves when the required checks are green (PO, see
      # dependabot-auto-merge.yml).
      all:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # The lock list of the gateway image: deploy/gateway/requirements.txt, via `uv pip compile` from the requirements.in
  # next to it. The uv ecosystem recognizes the file by its header (`--output-file`, `--universal`, `--python-version`, hashes),
  # bumps with `-P <package>==<version>` and regenerates the WHOLE file — new transitive dependencies included
  # (dependabot-core: uv/lib/dependabot/uv/file_updater/compile_file_updater.rb). Pattern: DashMyBoard /app.
  - package-ecosystem: uv
    directory: /deploy/gateway
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # As above: patch and minor bundled, majors singly.
      all:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # pydantic pins pydantic-core EXACTLY (`pydantic-core==…`), and pydantic-core often appears before the pydantic
    # that requires it. Bumped line by line (until 2026-10-10, pip), `pip check` turned red (#81, #112). Freshly compiled,
    # a pydantic-core PR alone would not be resolvable — it therefore keeps moving only together with pydantic.
    ignore:
      - dependency-name: "pydantic-core"

  # The bundled reference stack (B4-12): Caddy is the network edge, and its pin in
  # deploy/forward-auth/docker-compose.yml aged until here without anyone seeing it — the
  # `docker` entry below reads only Dockerfiles, no compose files.
  - package-ecosystem: docker-compose
    directory: /deploy/forward-auth
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"

  # The throwaway targets of the dress rehearsal (release.yml on every PR). The rehearsal itself accepts their update:
  # if the registry or the package server does not start, `rehearsal` is red.
  - package-ecosystem: docker-compose
    directory: /.github/rehearsal
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The base image is pinned by digest; without Dependabot it would stand still forever.
  # Plus the Caddy with caddy-jwt for the gate template (ADR-9). Its plugin version (a Go module,
  # ARG CADDY_JWT) is not seen by Dependabot — it is bumped by hand, the CI job gate-caddy checks it.
  - package-ecosystem: docker
    directories: ["/", "/deploy/forward-auth/caddy-gate"]
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
