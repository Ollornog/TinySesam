# SHA-pinned actions go stale silently — a commit SHA does not say that a newer
# version exists. Dependabot reads the version comment behind the pin and opens
# a PR with the SHA of the new version. Without this file the SHA pinning would be a
# security gain paid for with maintenance blindness.
#
# Security updates for dependencies run separately through the repo switch
# (Dependabot security updates) and need no configuration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Several parts of ONE action (`github/codeql-action/init` and `/analyze`) must have the same
      # version: bumped singly, `init` stood at 4.38.2 and `analyze` at 4.38.1, and
      # CodeQL aborted ("Loaded a configuration file for version '4.38.2', but running version
      # '4.38.1'", #110/#111). That is why they are bumped together. `tests/test_repo.py` demands one
      # such group for every action that is used with several subpaths.
      codeql:
        patterns: ["github/codeql-action*"]

  # Pinned Python dependencies — where there ARE pins. Up to 0.19.0 there was an entry here for
  # `directory: /`, i.e. for the `>=` bounds in pyproject.toml. It could never do anything: an
  # open lower bound already allows every new version, Dependabot sees nothing to raise (B4-3
  # from T-13). The question whether a FLOOR is still free of known vulnerabilities is answered by the gate in
  # .github/workflows/audit.yml (resolution `lowest-direct` against pip-audit) — red instead of a PR.
  #
  # What is shipped or used for building, on the other hand, stands pinned with hashes, and there
  # Dependabot bumps the lines: the lock list of the gateway image, the build tools of wheel
  # and sdist, the tools of the vulnerability gate.
  #
  # The lock list of the gateway image has been maintained by the uv entry below since 2026-10-10: this pip entry bumped it
  # line by line and did not add new transitive dependencies (fastapi 0.142 → opentelemetry-api, #126 red).
  # The two tool lists stay here — they are called `tools.in`, and whether the uv ecosystem finds the output file for
  # them is not clear from the source (it looks for `<name>.txt` or the .in at the end of the header line).
    ignore:
      # The pin belongs to the repokit template (`tests/_kit/vorlage_actions.yml`), it arrives with `repokit sync`.
      # A bump here would deviate from the template, and the PR would never turn green (kit 0.36.0).
      - dependency-name: "actions/create-github-app-token"
  - package-ecosystem: pip
    directories: ["/.github/packaging", "/.github/audit"]
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # One PR per month instead of one per package — otherwise a solo project drowns in noise.
      #
      # **Only patch and minor.** Majors come singly: if one breaks, the red PR is attributable to exactly this
      # package, instead of holding up a collective PR with three harmless patches. Since
      # 2026-10-11 majors also merge themselves when the required checks are green (PO, see
      # dependabot-auto-merge.yml).
      all:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # The lock list of the gateway image: deploy/gateway/requirements.txt, via `uv pip compile` from the requirements.in
  # next to it. The uv ecosystem recognizes the file by its header (`--output-file`, `--universal`, `--python-version`, hashes),
  # bumps with `-P <package>==<version>` and regenerates the WHOLE file — new transitive dependencies included
  # (dependabot-core: uv/lib/dependabot/uv/file_updater/compile_file_updater.rb). Pattern: DashMyBoard /app.
  - package-ecosystem: uv
    directory: /deploy/gateway
    # Transitive packages too (2026-11-14): without `allow`, Dependabot bumps only what requirements.in names.
    # opentelemetry-api (via fastapi) sat on 1.45.1 with CVE-2026-126360 although 1.45.2 had been out since 2026-10-29;
    # the only PR came as a security update through the pip ecosystem (GitHub maps requirements.txt to pip), and
    # pip-compile drops the uv output (markers, setuptools) — #223 was red. uv supports `dependency-type: all`.
    allow:
      - dependency-type: all
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    # Weekly, not monthly (2026-11-14): a fix that is already out should not wait up to a month.
    schedule:
      interval: weekly
    groups:
      # As above: patch and minor bundled, majors singly.
      all:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # pydantic pins pydantic-core EXACTLY (`pydantic-core==…`), and pydantic-core often appears before the pydantic
    # that requires it. Bumped line by line (until 2026-10-10, pip), `pip check` turned red (#81, #112). Freshly compiled,
    # a pydantic-core PR alone would not be resolvable — it therefore keeps moving only together with pydantic.
    ignore:
      - dependency-name: "pydantic-core"

  # The bundled reference stack (B4-12): Caddy is the network edge, and its pin in
  # deploy/forward-auth/docker-compose.yml aged until here without anyone seeing it — the
  # `docker` entry below reads only Dockerfiles, no compose files.
  - package-ecosystem: docker-compose
    directory: /deploy/forward-auth
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"
    ignore:
      # The own image carries the release version and moves with scripts/_release.py, not with Dependabot.
      - dependency-name: "ollornog/tinysesam"

  # The home-network override (T-37) pins its own Caddy — the one with `tls internal` for a bare IP address.
  - package-ecosystem: docker-compose
    directory: /deploy/home-network
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"

  # The quickstart stack (deploy/quickstart): its example application (traefik/whoami) is pinned by version and digest.
  # The two own images carry the release version and move with the release, not with Dependabot — so they are ignored
  # by name (Dependabot names a ghcr.io image without the registry). Without that the job of 2026-11-20 died on
  # `ollornog/tinysesam-caddy-gate`, which the registry did not have before its first release (DockerRegistry2::NotFound),
  # and every run after a release would race the release PR with a bump of its own.
  - package-ecosystem: docker-compose
    directory: /deploy/quickstart
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"
    ignore:
      - dependency-name: "ollornog/tinysesam"
      - dependency-name: "ollornog/tinysesam-caddy-gate"

  # Caddy and caddy-jwt in the image tinysesam-caddy-gate (deploy/forward-auth/caddy-gate): ordinary Go dependencies in
  # go.mod, hashes in go.sum, built without xcaddy (main.go). Until 2026-11-20 the plugin version was an ARG for xcaddy that
  # no Dependabot entry could see — bumped by hand, i.e. forgotten. Direct dependencies only (Caddy, caddy-jwt); indirect
  # ones with a known vulnerability come as security updates (repo switch). The CI job `gate-caddy` builds the image from
  # the PR and runs tests/test_gate_caddy.py + tests/test_quickstart.py, `image-probe` scans it (release.yml).
  - package-ecosystem: gomod
    directory: /deploy/forward-auth/caddy-gate
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
    commit-message:
      prefix: "deploy"

  # The throwaway targets of the dress rehearsal (release.yml on every PR). The rehearsal itself accepts their update:
  # if the registry or the package server does not start, `rehearsal` is red.
  # NOT under .github/ (2026-11-13): there Dependabot may not open a PR for docker files — the job of 2026-11-12 ended
  # with "The request contains invalid or unauthorized changes" (dependency_file_not_supported), as a docker file under
  # .github/ in another repository had on 2026-11-05. tests/test_repo.py keeps every docker ecosystem out of .github/.
  - package-ecosystem: docker-compose
    directory: /tools/rehearsal
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  # The base images are pinned by digest; without Dependabot they would stand still forever. The gateway Dockerfile has
  # two since T-59: `python:3.x-slim` (build stage, the interpreter) and `gcr.io/distroless/base-debian13:nonroot`
  # (runtime). The distroless tag is not a version, so Dependabot refreshes only its digest — and its cooldown has no
  # release date outside Docker Hub (dependabot-core docker/update_checker.rb, `registry_tag_release_date`), so it
  # fails open there: a moved digest comes the next day.
  # Plus the two images of tinysesam-caddy-gate (Go builder, Caddy base); Caddy and caddy-jwt themselves are in the
  # `gomod` entry above. The CI job gate-caddy checks the result.
  #
  # DAILY, not monthly (2026-11-12): the cooldown of the docker ecosystem is measured against Docker Hub's
  # `tag_last_pushed` of the candidate tag (dependabot-core docker/update_checker.rb, apply_cooldown). Official images
  # re-push their floating tags (`3.15-slim`) every few days; a monthly run that lands within three days of such a push
  # skips every candidate, reports "up to date" and keeps the old digest for another month. That is how the image stood
  # on Python 3.14.7 from October to November while 3.14.10 was out (the 3.15 PR #202 was red, its recreate on 11-07
  # fell into the cooldown and closed it). A daily run finds the first day on which the tag has been stable for three
  # days — the cooldown stays, only the chance to miss it goes. Also: as long as a newer minor exists (3.15 while the pin
  # says 3.14), Dependabot offers only the minor, never a digest refresh of the old one — stay on the newest line.
  - package-ecosystem: docker
    directories: ["/", "/deploy/forward-auth/caddy-gate"]
    # Waiting period before version updates (PO 2026-09-28), does not apply to security updates.
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    commit-message:
      prefix: "ci"
