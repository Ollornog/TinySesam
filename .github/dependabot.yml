# SHA-gepinnte Actions veralten still — ein Commit-SHA sagt nicht, dass eine neuere
# Version existiert. Dependabot liest den Versions-Kommentar hinter dem Pin und öffnet
# einen PR mit dem SHA der neuen Version. Ohne diese Datei wäre das SHA-Pinning ein
# Sicherheitsgewinn, den man mit Wartungsblindheit bezahlt.
#
# Sicherheits-Updates für Abhängigkeiten laufen getrennt davon über den Repo-Schalter
# (Dependabot security updates) und brauchen keine Konfiguration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Mehrere Teile EINER Action (`github/codeql-action/init` und `/analyze`) müssen dieselbe
      # Fassung haben: Einzeln gehoben stand `init` auf 4.38.2 und `analyze` auf 4.38.1, und
      # CodeQL brach ab („Loaded a configuration file for version '4.38.2', but running version
      # '4.38.1'“, #110/#111). Deshalb heben sie gemeinsam. `tests/test_repo.py` verlangt eine
      # solche Gruppe für jede Action, die mit mehreren Unterpfaden benutzt wird.
      codeql:
        patterns: ["github/codeql-action*"]

  # Gepinnte Python-Abhängigkeiten — dort, wo es Pins GIBT. Bis 0.19.0 stand hier ein Eintrag für
  # `directory: /`, also für die `>=`-Grenzen in pyproject.toml. Der konnte nie etwas tun: Eine
  # offene Untergrenze erlaubt jede neue Fassung schon, Dependabot sieht nichts zu heben (B4-3
  # aus T-13). Die Frage, ob ein BODEN noch lückenfrei ist, beantwortet jetzt das Tor in
  # .github/workflows/audit.yml (Auflösung `lowest-direct` gegen pip-audit) — rot statt PR.
  #
  # Was ausgeliefert oder zum Bauen benutzt wird, steht dagegen gepinnt samt Hashes, und dort
  # hebt Dependabot die Zeilen: die Sperrliste des Gateway-Abbilds, die Bauwerkzeuge von Wheel
  # und sdist, die Werkzeuge des Schwachstellen-Tors.
  #
  # Die Sperrliste des Gateway-Abbilds pflegt seit 2026-10-10 der uv-Eintrag darunter: Dieser pip-Eintrag hob sie
  # zeilenweise und trug neue transitive Abhängigkeiten nicht nach (fastapi 0.142 → opentelemetry-api, #126 rot).
  # Die zwei Werkzeuglisten bleiben hier — sie heissen `werkzeuge.in`, und ob das uv-Ökosystem dazu die Ausgabedatei
  # findet, ist im Quelltext nicht eindeutig (es sucht `<name>.txt` oder die .in am Zeilenende des Kopfes).
  - package-ecosystem: pip
    directories: ["/.github/bau", "/.github/audit"]
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Ein PR je Monat statt einem je Paket — sonst ertrinkt ein Solo-Projekt in Rauschen.
      #
      # **Nur patch und minor.** Ein Major landete sonst im Sammel-PR und würde mit ihm
      # durchgewinkt: Dieselbe Prüfung, die für drei harmlose Patches genügt, entscheidet dann
      # auch über einen Versionssprung mit Bruch. Majors kommen deshalb einzeln — dort ist der
      # CHANGELOG des Pakets die eigentliche Arbeit, nicht der grüne Haken der CI.
      alle:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # Die Sperrliste des Gateway-Abbilds: deploy/gateway/requirements.txt, per `uv pip compile` aus requirements.in
  # daneben. Das uv-Ökosystem erkennt die Datei am Kopf (`--output-file`, `--universal`, `--python-version`, Hashes),
  # hebt mit `-P <paket>==<fassung>` und erzeugt die GANZE Datei neu — neue transitive Abhängigkeiten eingeschlossen
  # (dependabot-core: uv/lib/dependabot/uv/file_updater/compile_file_updater.rb). Muster: DashMyBoard /app.
  - package-ecosystem: uv
    directory: /deploy/gateway
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    groups:
      # Wie oben: patch und minor gebündelt, Majors einzeln.
      alle:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # pydantic legt pydantic-core EXAKT fest (`pydantic-core==…`), und pydantic-core erscheint oft vor dem pydantic,
    # das es verlangt. Zeilenweise gehoben (bis 2026-10-10, pip) wurde `pip check` rot (#81, #112). Neu kompiliert
    # wäre ein pydantic-core-PR allein nicht auflösbar — es wandert deshalb weiter nur mit pydantic mit.
    ignore:
      - dependency-name: "pydantic-core"

  # Der mitgelieferte Referenz-Stack (B4-12): Caddy ist der Netzrand, und sein Pin in
  # deploy/forward-auth/docker-compose.yml alterte bis hierhin, ohne dass jemand es sah — der
  # `docker`-Eintrag unten liest nur Dockerfiles, keine Compose-Dateien.
  - package-ecosystem: docker-compose
    directory: /deploy/forward-auth
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"

  # Das Basis-Abbild ist per Digest gepinnt; ohne Dependabot bliebe es für immer stehen.
  # Dazu das Caddy mit caddy-jwt für die Gate-Vorlage (ADR-9). Dessen Plugin-Version (ein Go-Modul,
  # ARG CADDY_JWT) sieht Dependabot nicht — die hebt man von Hand, der CI-Job gate-caddy prüft sie.
  - package-ecosystem: docker
    directories: ["/", "/deploy/forward-auth/caddy-gate"]
    # Wartezeit vor Versions-Updates (PO 2026-09-28), gilt nicht für Sicherheits-Updates.
    cooldown:
      default-days: 3
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
