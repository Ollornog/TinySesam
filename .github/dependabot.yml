# SHA-gepinnte Actions veralten still — ein Commit-SHA sagt nicht, dass eine neuere
# Version existiert. Dependabot liest den Versions-Kommentar hinter dem Pin und öffnet
# einen PR mit dem SHA der neuen Version. Ohne diese Datei wäre das SHA-Pinning ein
# Sicherheitsgewinn, den man mit Wartungsblindheit bezahlt.
#
# Sicherheits-Updates für Abhängigkeiten laufen getrennt davon über den Repo-Schalter
# (Dependabot security updates) und brauchen keine Konfiguration.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # Gepinnte Python-Abhängigkeiten — dort, wo es Pins GIBT. Bis 0.19.0 stand hier ein Eintrag für
  # `directory: /`, also für die `>=`-Grenzen in pyproject.toml. Der konnte nie etwas tun: Eine
  # offene Untergrenze erlaubt jede neue Fassung schon, Dependabot sieht nichts zu heben (B4-3
  # aus T-13). Die Frage, ob ein BODEN noch lückenfrei ist, beantwortet jetzt das Tor in
  # .github/workflows/audit.yml (Auflösung `lowest-direct` gegen pip-audit) — rot statt PR.
  #
  # Was ausgeliefert oder zum Bauen benutzt wird, steht dagegen gepinnt samt Hashes, und dort
  # hebt Dependabot die Zeilen: die Sperrliste des Gateway-Abbilds, die Bauwerkzeuge von Wheel
  # und sdist, die Werkzeuge des Schwachstellen-Tors.
  - package-ecosystem: pip
    directories: ["/deploy/gateway", "/.github/bau", "/.github/audit"]
    schedule:
      interval: monthly
    groups:
      # Ein PR je Monat statt einem je Paket — sonst ertrinkt ein Solo-Projekt in Rauschen.
      #
      # **Nur patch und minor.** Ein Major landete sonst im Sammel-PR und würde mit ihm
      # durchgewinkt: Dieselbe Prüfung, die für drei harmlose Patches genügt, entscheidet dann
      # auch über einen Versionssprung mit Bruch. Majors kommen deshalb einzeln — dort ist der
      # CHANGELOG des Pakets die eigentliche Arbeit, nicht der grüne Haken der CI.
      alle:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # Der mitgelieferte Referenz-Stack (B4-12): Caddy ist der Netzrand, und sein Pin in
  # deploy/forward-auth/docker-compose.yml alterte bis hierhin, ohne dass jemand es sah — der
  # `docker`-Eintrag unten liest nur Dockerfiles, keine Compose-Dateien.
  - package-ecosystem: docker-compose
    directory: /deploy/forward-auth
    schedule:
      interval: monthly
    commit-message:
      prefix: "deploy"

  # Das Basis-Abbild ist per Digest gepinnt; ohne Dependabot bliebe es für immer stehen.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
