# Generalprobe (PO 2026-10-11): die Wegwerf-Ziele, gegen die release.yml auf JEDEM Pull Request
# veröffentlicht — eine Registry und ein Paket-Server auf dem Runner. So laufen Anmeldung,
# schiebender Bau, SBOM, PyPI-Upload und Beglaubigung mit genau den Actions des Tags, ohne dass
# etwas nach draußen geht; ihre Updates nimmt damit ein Pflicht-Check ab, und sie mergen selbst.
#
# Diese Datei ist die Quelle der Abbilder, nicht der Startweg: Der Job `generalprobe-ziele` liest
# sie, `generalprobe` startet die Registry als Dienst und den Paket-Server per `docker run` (er
# braucht Argumente, die ein Dienst nicht kennt). Dependabot (docker-compose) hält sie aktuell, und
# die Generalprobe nimmt das Update gleich mit ab.
services:
  registry:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
  pypi:
    image: pypiserver/pypiserver:v2.4.2@sha256:6c4874820281d5045c739f049dc1077d292177d8fd5c18d306b8239439c44925
    command: ["run", "-a", ".", "-P", ".", "-p", "8080", "/data/packages"]
