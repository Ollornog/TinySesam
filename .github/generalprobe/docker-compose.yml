# Dress rehearsal (PO 2026-10-11): the throwaway targets that release.yml publishes against on EVERY
# pull request — a registry and a package server on the runner. This way sign-in, pushing
# build, SBOM, PyPI upload and attestation run with exactly the actions of the tag, without
# anything going outside; a required check thus covers their updates, and they merge themselves.
#
# This file is the source of the images, not the way they are started: the job `generalprobe-ziele`
# reads it, `generalprobe` starts the registry as a service and the package server via `docker run`
# (it needs arguments that a service does not know). Dependabot (docker-compose) keeps them up to
# date, and the dress rehearsal checks the update right away.
services:
  registry:
    image: registry:3.1.2@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
  pypi:
    image: pypiserver/pypiserver:v2.4.2@sha256:6c4874820281d5045c739f049dc1077d292177d8fd5c18d306b8239439c44925
    command: ["run", "-a", ".", "-P", ".", "-p", "8080", "/data/packages"]
