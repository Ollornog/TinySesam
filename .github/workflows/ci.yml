name: tests

# Feature-Branches laufen bewusst OHNE CI — dort prüft `ci-local` (Docker, offline).
# Volle CI erst beim Pull Request und auf main. Gemergt wird nach grünem lokalem Lauf.
# Notausgang für WIP auf main: [skip ci] in der Commit-Message.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least Privilege. Es gibt keinen sicheren Default — die Ausgangsberechtigung des
# GITHUB_TOKEN kommt aus der Repo-Einstellung. Sobald EINE Berechtigung explizit
# gesetzt ist, fallen alle übrigen auf `none`.
permissions:
  contents: read

# `setuptools`/`wheel` stehen bei jedem Install dabei: `tests/test_packaging.py` baut Wheel und
# sdist und sieht hinein. Seit Python 3.12 bringt eine frische Umgebung setuptools nicht mehr mit,
# und `pip install -e .` legt es nur in seine eigene Bau-Isolierung, nicht in die Umgebung.
jobs:
  # Voller Lauf mit allen Extras über die gefuehrte Matrix — die letzten DREI stable
  # Minors (PO 2026-09-22). Die Versionen stehen NICHT hier zu Hause: gefuehrt werden
  # sie in repokit (tests/_kit/python_matrix.json), und dasselbe Trio traegt das
  # Abbild ci-python-web in /opt/ci-matrix.
  #   3.12 = Untergrenze aus requires-python, zugleich Prod / System-Python im Abbild
  #   3.13 = Mitte
  #   3.14 = Obergrenze, aktuelle stable (seit 10/2025)
  # 3.10 und 3.11 fielen am 2026-09-22 raus: 3.10 geht am 31.10.2026 EOL, und die
  # Untergrenze wandert mit der Regel statt mit einer einmal gesetzten Zahl.
  # Prerelease (3.15) läuft separat nightly mit continue-on-error, damit ein RC-Bug
  # keinen Push blockiert — und NUR dort: ein Gate-Bein gehoert nicht in einen Job,
  # der nicht rot werden kann.
  full:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Systempaket für SAML (xmlsec)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
      - name: Install (alle Extras)
        run: pip install -e '.[all]' setuptools wheel mypy
      # xmlsec hat nicht für jede Python-Reihe ein Wheel (3.15: keins). Dann baut es gegen das libxml2 des Systems,
      # das lxml-Wheel bringt aber sein eigenes mit — `import xmlsec` scheitert mit „lxml & xmlsec libxml2 library
      # version mismatch“. In dem Fall lxml aus dem Quelltext gegen dasselbe libxml2 (wie im Abbild ci-python-web).
      - name: lxml passend zu xmlsec
        run: |
          python -c "import xmlsec" 2>/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxml2-dev libxslt1-dev
          pip install --no-binary lxml --force-reinstall --no-deps "lxml==$(python -c 'import importlib.metadata as m; print(m.version("lxml"))')"
          python -c "import lxml.etree, xmlsec"
      - name: Tests
        run: python tests/run_all.py

  # Minimal-Install ohne Extras: sichert den stdlib-scrypt-Fallback + Kernpfad ab
  # (Suiten, die zwingend Extras brauchen, werden vom Runner als skip gewertet).
  minimal:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (nur Kern + httpx fürs TestClient-Werkzeug)
        run: pip install -e . httpx setuptools wheel
      - name: Tests (Kern / scrypt-Fallback; Passkey/OIDC-Suiten werden übersprungen)
        run: python tests/run_all.py

  # Die Seiten im echten Browser: Konsolenfehler, Breiten, Sprachwechsel, Dark-Mode, Login.
  # Ohne diesen Job faellt eine Design-Regression erst dem Nutzer auf.
  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Chrome installieren
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          install-dependencies: true
      - name: Chrome vorhanden?
        run: which chrome || which google-chrome; chrome --version || google-chrome --version
      - name: Abhängigkeiten
        run: pip install -e . uvicorn websockets httpx setuptools wheel
      - name: Website bauen (muss durchlaufen)
        run: python -m web.build _site
      - name: Browser-Test
        run: python tests/test_browser.py
      - name: Repo-Hygiene
        run: python tests/test_repo.py
      - name: Website-Test
        run: python tests/test_site.py

  # Gate-Token durch einen ECHTEN Caddy mit caddy-jwt (ADR-9). Gebaut wird genau das Abbild aus
  # deploy/forward-auth/caddy-gate/Dockerfile — dieselben Pins, die ein Betreiber baut. Mit
  # gesetzter TINYSESAM_GATE_CADDY ist der Test Pflicht: ein fehlender oder falscher Caddy ist
  # rot, kein Skip. In den übrigen Jobs fehlt die Variable, dort meldet die Suite „übersprungen".
  gate-caddy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install -e . uvicorn httpx setuptools wheel
      - name: Caddy mit caddy-jwt bauen (deploy/forward-auth/caddy-gate)
        run: |
          docker build -t caddy-gate deploy/forward-auth/caddy-gate
          id="$(docker create caddy-gate)"
          docker cp "$id:/usr/bin/caddy" "$RUNNER_TEMP/caddy-gate"
          docker rm "$id"
          "$RUNNER_TEMP/caddy-gate" version
      - name: Gate-Token durch Caddy
        run: TINYSESAM_GATE_CADDY="$RUNNER_TEMP/caddy-gate" python tests/test_gate_caddy.py
      # Abnahme des Referenz-Stacks deploy/forward-auth/docker-compose.yml (seit 2026-10-11): Damit nimmt ein
      # Pflicht-Check auch die Dependabot-PRs des docker-compose-Eintrags ab, und sie mergen selbst. Die Datei muss
      # sich auflösen lassen, jedes Abbild darin muss sich unter Tag und Digest ziehen lassen, und das Caddy AUS DER
      # COMPOSE-DATEI muss die mitgelieferte Caddyfile annehmen.
      - name: Referenz-Stack (docker-compose) abnehmen
        run: |
          set -euo pipefail
          f=deploy/forward-auth/docker-compose.yml
          docker compose -f "$f" config --quiet
          bilder="$(docker compose -f "$f" config --images)"
          [ -n "$bilder" ] || { echo "keine Abbilder in $f"; exit 1; }
          while IFS= read -r b; do docker pull -q "$b"; done <<<"$bilder"
          caddy="$(grep -m1 '^caddy:' <<<"$bilder")" || { echo "kein caddy-Abbild in $f"; exit 1; }
          docker run --rm -e TS_AUTH_UPSTREAM=tinysesam:8000 -e TS_APP_UPSTREAM=app:9000 \
            -v "$PWD/deploy/forward-auth/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Wiederholbarkeit: dieselbe Suite ZWEIMAL im selben Arbeitsverzeichnis.
  # Ein Test, der beim zweiten Lauf rot wird, ist kaputt — nicht der Code.
  # Danach muss der Baum unverändert sein: eine Suite, die schreibt, ist beim
  # nächsten Lauf nicht mehr wiederholbar. Lokales Äquivalent: `ci-local --full`.
  # Bewusst NICHT im pre-push-Hook — das verdoppelte die Wartezeit bei jedem Push.
  repeat:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Chrome installieren
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          install-dependencies: true
      - name: Systempaket für SAML (xmlsec)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
      - name: Install (alle Extras)
        run: pip install -e '.[all]' uvicorn websockets setuptools wheel mypy
      # Vorher-Stand festhalten: Seit Kit 0.20.1 meldet der Check ohne ihn einen veränderten
      # Baum nur noch als „nicht entscheidbar" (Exit 2) — der Job würde zwar rot, sagte aber
      # nicht, dass es die Suite war. Mit dem Stand ist ein Rückstand belegt (Exit 1).
      - name: Vorher-Stand des Baums
        run: scripts/_residue_check.sh snapshot > "$RUNNER_TEMP/baum-vorher.txt"
      - name: Erster Lauf
        run: scripts/check.sh
      - name: Zweiter Lauf (muss ebenfalls grün sein)
        run: scripts/check.sh
      # Dieselbe Prüfung, die der pre-push-Hook fährt. Vorher stand hier ein roher
      # `git status --porcelain`, der `.ci-allow-dirty` nicht kannte — das verbindliche
      # Gate widersprach damit dem lokalen Netz.
      - name: Baum muss unverändert sein
        run: scripts/_residue_check.sh check --seit "$RUNNER_TEMP/baum-vorher.txt"
