name: tests

# Feature branches deliberately run WITHOUT CI — `ci-local` (Docker, offline) checks them there.
# Full CI only on the pull request and on main. Merging happens after a green local run.
# Escape hatch for WIP on main: [skip ci] in the commit message.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. There is no safe default — the initial permission of the
# GITHUB_TOKEN comes from the repo setting. As soon as ONE permission is explicitly
# set, all others fall back to `none`.
permissions:
  contents: read

# `setuptools`/`wheel` are part of every install: `tests/test_packaging.py` builds wheel and
# sdist and looks inside. Since Python 3.12 a fresh environment no longer ships setuptools,
# and `pip install -e .` puts it only into its own build isolation, not into the environment.
jobs:
  # Full run with all extras over the managed matrix — the last THREE stable
  # minors (PO 2026-09-22). The versions do NOT live here: they are managed
  # in repokit (tests/_kit/python_matrix.json), and the same trio is carried by the
  # image ci-python-web in /opt/ci-matrix.
  #   3.12 = lower bound from requires-python, also prod / system Python in the image
  #   3.13 = middle
  #   3.14 = upper bound, current stable (since 10/2025)
  # 3.10 and 3.11 were dropped on 2026-09-22: 3.10 goes EOL on 2026-10-31, and the
  # lower bound moves with the rule instead of with a number set once.
  # The prerelease (3.15) runs separately nightly with continue-on-error, so that an RC bug
  # does not block a push — and ONLY there: a gate leg does not belong in a job
  # that cannot turn red.
  full:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: System package for SAML (xmlsec)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
      - name: Install (all extras)
        run: pip install -e '.[all]' setuptools wheel mypy
      # xmlsec has no wheel for every Python series (3.15: none). Then it builds against the system's libxml2,
      # but the lxml wheel ships its own — `import xmlsec` fails with "lxml & xmlsec libxml2 library
      # version mismatch". In that case lxml from source against the same libxml2 (as in the image ci-python-web).
      - name: lxml matching xmlsec
        run: |
          python -c "import xmlsec" 2>/dev/null && exit 0
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxml2-dev libxslt1-dev
          pip install --no-binary lxml --force-reinstall --no-deps "lxml==$(python -c 'import importlib.metadata as m; print(m.version("lxml"))')"
          python -c "import lxml.etree, xmlsec"
      - name: Tests
        run: python tests/run_all.py

  # Minimal install without extras: covers the stdlib scrypt fallback + core path
  # (suites that strictly need extras are counted as skip by the runner).
  minimal:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install (core only + httpx for the TestClient tool)
        run: pip install -e . httpx setuptools wheel
      - name: Tests (core / scrypt fallback; passkey/OIDC suites are skipped)
        run: python tests/run_all.py

  # The pages in a real browser: console errors, widths, language switch, dark mode, login.
  # Without this job a design regression is only noticed by the user.
  browser:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          install-dependencies: true
      - name: Chrome present?
        run: which chrome || which google-chrome; chrome --version || google-chrome --version
      - name: Dependencies
        run: pip install -e . uvicorn websockets httpx setuptools wheel
      - name: Build the website (must succeed)
        run: python -m web.build _site
      - name: Browser test
        run: python tests/test_browser.py
      - name: Repo hygiene
        run: python tests/test_repo.py
      - name: Website test
        run: python tests/test_site.py

  # Gate token through a REAL Caddy with caddy-jwt (ADR-9). Exactly the image from
  # deploy/forward-auth/caddy-gate/Dockerfile is built — the same pins an operator builds. With
  # TINYSESAM_GATE_CADDY set the test is mandatory: a missing or wrong Caddy is
  # red, not a skip. In the other jobs the variable is absent, there the suite reports "skipped".
  gate-caddy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Dependencies
        run: pip install -e . uvicorn httpx setuptools wheel
      - name: Build Caddy with caddy-jwt (deploy/forward-auth/caddy-gate)
        run: |
          docker build -t caddy-gate deploy/forward-auth/caddy-gate
          id="$(docker create caddy-gate)"
          docker cp "$id:/usr/bin/caddy" "$RUNNER_TEMP/caddy-gate"
          docker rm "$id"
          "$RUNNER_TEMP/caddy-gate" version
      - name: Gate token through Caddy
        run: TINYSESAM_GATE_CADDY="$RUNNER_TEMP/caddy-gate" python tests/test_gate_caddy.py
      # Acceptance of the reference stack deploy/forward-auth/docker-compose.yml (since 2026-10-11): This way a
      # required check also covers the Dependabot PRs of the docker-compose entry, and they merge themselves. The file must
      # resolve, every image in it must be pullable by tag and digest, and the Caddy FROM THE
      # COMPOSE FILE must accept the shipped Caddyfile.
      - name: Accept the reference stack (docker-compose)
        run: |
          set -euo pipefail
          f=deploy/forward-auth/docker-compose.yml
          docker compose -f "$f" config --quiet
          images="$(docker compose -f "$f" config --images)"
          [ -n "$images" ] || { echo "no images in $f"; exit 1; }
          # The own image at the package version does not exist before its tag: the release PR sets the version,
          # the tag builds the image. `image-probe` builds and starts exactly that image on every PR.
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          own="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tinysesam:v$version"
          while IFS= read -r b; do
            if [ "$b" = "$own" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "skipped (built by the tag v$version, not yet set): $b"; continue
            fi
            docker pull -q "$b"
          done <<<"$images"
          caddy="$(grep -m1 '^caddy:' <<<"$images")" || { echo "no caddy image in $f"; exit 1; }
          docker run --rm -e TS_AUTH_UPSTREAM=tinysesam:8000 -e TS_APP_UPSTREAM=app:9000 \
            -v "$PWD/deploy/forward-auth/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$caddy" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # Repeatability: the same suite TWICE in the same working directory.
  # A test that turns red on the second run is broken — not the code.
  # Afterwards the tree must be unchanged: a suite that writes is no longer
  # repeatable on the next run. Local equivalent: `ci-local --full`.
  # Deliberately NOT in the pre-push hook — that doubled the wait on every push.
  repeat:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          install-dependencies: true
      - name: System package for SAML (xmlsec)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
      - name: Install (all extras)
        run: pip install -e '.[all]' uvicorn websockets setuptools wheel mypy
      # Record the before state: since kit 0.20.1 the check, without it, reports a changed
      # tree only as "nicht entscheidbar" (undecidable) (exit 2) — the job would turn red, but would not say
      # that the suite was responsible. With the state, a residue is proven (exit 1).
      - name: State of the tree before
        run: scripts/_residue_check.sh snapshot > "$RUNNER_TEMP/tree-before.txt"
      - name: First run
        run: scripts/check.sh
      - name: Second run (must also be green)
        run: scripts/check.sh
      # The same check that the pre-push hook runs. This used to be a raw
      # `git status --porcelain`, which did not know `.ci-allow-dirty` — the binding
      # gate thus contradicted the local safety net.
      - name: Tree must be unchanged
        run: scripts/_residue_check.sh check --seit "$RUNNER_TEMP/tree-before.txt"
