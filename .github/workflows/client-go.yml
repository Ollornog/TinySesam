# The Go gate client (clients/go, T-80): gofmt, go vet, staticcheck, govulncheck, the tests with the race detector
# (every vector of spec/vectors, the JWKS server tests) and a short fuzz run, on the two supported Go releases.
#
# Public repository → GitHub-hosted runners only. No path filter on the trigger: a required check that is skipped
# blocks the merge forever (clients/README.md). Instead the job ends early and green when a pull request touches
# neither clients/go/, spec/, the tools in .github/audit/go.mod nor this file; on main and by hand it always runs in full.
name: client-go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Sprint lane and docs fast lane of the shared kit (T-131): see the job `classify` in ci.yml. A skipped job is a
  # green check; the aggregate job counts a skipped one green only with the answer `nur_text=ja`.
  classify:
    name: Text or code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nur_text: ${{ steps.classify.outputs.nur_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The pull request's merge commit and its first parent: scripts/_nur_text.sh compares the two.
          fetch-depth: 2
      - name: Classify
        id: classify
        env:
          WORKFLOW: ${{ github.workflow }}
        run: |
          if reason="$(scripts/_nur_text.sh)"; then
            # Sprint lane, T-150: a sprint pull request that changes this workflow's gate client or spec/ runs its jobs.
            if [[ "$reason" == "SPRINT LANE"* ]] && scope="$(scripts/_client_scope.sh "$WORKFLOW")"; then
              reason="$reason. But $scope"
            else
              echo "nur_text=ja" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "$reason"

  client-go:
    needs: classify
    if: ${{ !cancelled() && needs.classify.outputs.nur_text != 'ja' }}
    name: client-go (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The current and the previous Go release (the two Go supports); setup-go resolves them to the newest patch.
        go: [stable, oldstable]
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its two parents: enough to see what the pull request changes.
          fetch-depth: 2

      - name: Scope — does the change touch the Go client?
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The scope lives in scripts/_client_scope.sh (T-150), shared with the job `classify`.
          if scripts/_client_scope.sh client-go; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "green without a run"
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        if: steps.scope.outputs.run == 'true'
        with:
          go-version: ${{ matrix.go }}
          # The library has no dependencies; the tools module is what gets downloaded and built.
          cache-dependency-path: .github/audit/go.sum

      - name: Go version
        if: steps.scope.outputs.run == 'true'
        run: go version

      - name: gofmt
        if: steps.scope.outputs.run == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        if: steps.scope.outputs.run == 'true'
        run: go vet ./...

      - name: Build staticcheck and govulncheck (pinned in .github/audit/go.mod)
        if: steps.scope.outputs.run == 'true'
        working-directory: .github/audit
        run: go build -o "$RUNNER_TEMP/bin/" tool  # `tool`: every tool of that go.mod

      - name: staticcheck
        if: steps.scope.outputs.run == 'true'
        run: '"$RUNNER_TEMP/bin/staticcheck" ./...'

      - name: govulncheck
        if: steps.scope.outputs.run == 'true'
        run: '"$RUNNER_TEMP/bin/govulncheck" ./...'

      - name: Tests with the race detector (all vectors of spec/vectors)
        if: steps.scope.outputs.run == 'true'
        run: go test -race -count=1 ./...

      # A count, not a duration: with `-fuzztime=<duration>` the fuzz coordinator can report its own deadline as
      # "--- FAIL: … context deadline exceeded" without any failing input (golang/go#75804; fixed in Go 1.26.12 and
      # 1.27.5). With `-fuzztime=<n>x` there is no deadline context, and a real failing input still fails the step.
      # 300000 runs take about 10 s per target on a hosted runner; the step has its own limit.
      - name: Fuzz every target (300000 runs each)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 8
        run: |
          targets="$(go test -list '^Fuzz' . | grep '^Fuzz')"
          if [ -z "$targets" ]; then
            echo "no fuzz targets found"
            exit 1
          fi
          for target in $targets; do
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=300000x .
          done

  # Aggregate for the branch protection (T-115): the Go client on every Go release.
  # A matrix leg added or dropped needs no change of the protection — it names this job only.
  # `always()`: the job also runs when a leg failed or was cancelled — then it is red itself; a skipped leg is green
  # only in the sprint or text lane (`classify`, T-131). Not skipped itself, so a required check never hangs.
  client-go-ok:
    name: client-go-ok
    if: ${{ always() }}
    needs: [classify, client-go]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `classify` itself does not count: a broken classifier leaves its answer empty, and then every job ran and decides.
      # A skipped job is green only with the answer `nur_text=ja` (sprint lane, text only), never otherwise.
      - name: Every job it needs succeeded (skipped only in the sprint or text lane)
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANE_ANSWER: ${{ needs.classify.outputs.nur_text }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "classify: nur_text=${LANE_ANSWER:-<empty>}"
          printf '%s\n' "$NEEDS" | jq -e --arg lane "$LANE_ANSWER" \
            'del(.classify) | all(.[]; .result == "success" or ($lane == "ja" and .result == "skipped"))' > /dev/null
