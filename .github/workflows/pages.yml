name: pages

# Builds the project website from web/site.py and publishes it on GitHub Pages.
# The HTML files are therefore not in the repo — only the source is changed.
#
# Needed once: Settings → Pages → Source = "GitHub Actions", via API:
#   gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow
# If the source is set to "Deploy from a branch", Pages serves the folder `docs/` — it has
# no index.html, hence 404; in addition the automatic build occupies the deployment, on which this
# workflow fails with "in progress deployment". Check:
#   gh api repos/<owner>/<repo>/pages --jq '{build_type,source}'

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      # The demo page renders login, account and admin panels from the library. If that
      # changes, the website changes — even without touching `web/`.
      - "tinysesam/**"
      - "docs/theme.css"
      - "docs/wizard.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Write permissions only where they are needed: in the deploy job. The build job only reads.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      # The demo page renders its panels from the library itself — for that it must be
      # importable. Without extras: the previews need neither OIDC nor SAML.
      - name: Bibliothek installieren
        run: pip install .

      - name: Website bauen
        run: python -m web.build _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      # include-hidden-files: since v4 dotfiles are OMITTED by default.
      # web/build.py creates `.nojekyll` — without the switch the file would silently drop
      # out of the artifact: CI green, artifact uploaded, deploy successful, only the
      # content would differ from before. The switch keeps the artifact exactly as
      # it was before the Node 24 jump — the bump raises the runtime, not the behaviour.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
