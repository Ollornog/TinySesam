name: audit

# The vulnerability gate (B4-2 from T-13). Up to 0.19.0 no run checked whether a dependency has a
# known vulnerability: Dependabot reports repo-wide, but a report is not a gate — a PR
# with a vulnerable resolution went green.
#
# Four resolutions are checked, because each carries a different promise:
#   newest  — what `pip install tinysesam[all]` pulls today
#   floor   — the lowest allowed version of every direct dependency (`lowest-direct`). This
#             is the promise of the `>=` bounds in pyproject.toml: anyone who holds on to them gets an
#             installation without known vulnerabilities. If an advisory appears for a floor, this
#             run turns red and the floor moves — Dependabot never raises an open `>=` floor,
#             since the range already allows the new version (B4-3).
#   gateway — the hashed lock list of the image (deploy/gateway/requirements.txt)
#   build   — the tools that build wheel and sdist (.github/packaging/requirements.txt), and those
#             of this gate itself (.github/audit/requirements.txt)
#
# Additionally nightly, because advisories appear without a code change. Public repo →
# `ubuntu-latest`, no self-hosted runners.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # GitHub cron only knows UTC: 02:45 UTC = 04:45 Europe/Berlin (CEST) or 03:45 (CET).
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # 3.14 for the probe of the image (its Python series), 3.13 (lower bound of the matrix) as default — the version
      # named last is the one that runs as `python`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: |
            3.14
            3.13

      # Separate environment, pinned with hashes: the checking tool does not belong in the environment it
      # checks, and does not come from the index in whatever the newest version is.
      - name: Tools
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes --no-deps -r .github/audit/requirements.txt

      # Only resolve, install nothing: resolution runs against the index, without executing any package
      # code (metadata from the wheels). `--python-version` = the lower bound from
      # requires-python, where the resolution is oldest.
      - name: Resolve (newest and lowest allowed versions)
        run: |
          uv="$RUNNER_TEMP/audit/bin/uv"
          "$uv" pip compile pyproject.toml --all-extras --python-version 3.13 --no-header \
              -o "$RUNNER_TEMP/newest.txt"
          "$uv" pip compile pyproject.toml --all-extras --resolution lowest-direct \
              --python-version 3.13 --no-header -o "$RUNNER_TEMP/floor.txt"
          # Zero packages would be a green run without findings: that is no evidence but an error.
          for f in newest floor; do
            [ "$(grep -cE '^[A-Za-z0-9_.-]+==' "$RUNNER_TEMP/$f.txt")" -gt 0 ] \
              || { echo "::error::$f: nothing resolved — the run checked nothing"; exit 1; }
          done

      # `--strict`: a package that pip-audit cannot look up is an error, not a skip.
      - name: pip-audit
        run: |
          audit="$RUNNER_TEMP/audit/bin/pip-audit"
          for f in newest floor; do
            echo "::group::$f"
            "$audit" --strict --progress-spinner off --no-deps --disable-pip -r "$RUNNER_TEMP/$f.txt"
            echo "::endgroup::"
          done
          for f in deploy/gateway/requirements.txt .github/packaging/requirements.txt \
                   .github/audit/requirements.txt; do
            echo "::group::$f"
            "$audit" --strict --progress-spinner off --require-hashes --disable-pip -r "$f"
            echo "::endgroup::"
          done

      # Is the lock list of the image complete? (A-1 from the re-check of B4-7.) The
      # Dockerfile installs it with `--no-deps` — pip does not notice a missing transitive dependency
      # there. And Dependabot bumps only single lines in a hashed list: if a
      # bump brings a new dependency along, it is missing. Without this step such a PR would go green, and
      # only the published image would abort at startup. The same steps as in the Dockerfile,
      # then `pip check` and the import. Read permission only; the wheels are fixed by hash.
      - name: Lock list of the image complete
        run: |
          python3.14 -m venv "$RUNNER_TEMP/gw"
          gw="$RUNNER_TEMP/gw/bin"
          "$gw/pip" install --require-hashes --no-deps -r deploy/gateway/requirements.txt
          "$gw/pip" install --no-deps --no-index --no-build-isolation .
          "$gw/pip" check
          "$gw/python" -c "import tinysesam.gateway"
