name: release

# Ein Git-Tag `vX.Y.Z` erzeugt dreierlei:
#   1. ein GitHub-Release mit Wheel, sdist und Prüfsummen
#   2. die Veröffentlichung desselben Wheels und sdists auf PyPI
#   3. ein Container-Abbild `ghcr.io/ollornog/tinysesam:<version>` (für das Gateway)
#
# Das sind die Verteilwege: TinySesam aktualisiert sich nicht selbst, es wird installiert —
# per `pip install tinysesam==<version>`, per gepinntem Tag oder per Abbild-Tag.
#
# Ausgelöst wird das NUR von einem Tag. Es rollt nichts automatisch aus; den Knopf drückt ein
# Mensch, indem er taggt (Continuous Delivery, kein Continuous Deployment).
#
# ── Einmalige Einrichtung auf pypi.org (Trusted Publishing, kein Token) ───────────────────
# Veröffentlicht wird ohne Geheimnis: PyPI vertraut diesem Workflow über dessen OIDC-Identität.
# Damit gibt es kein Token im Repo, keines, das rotiert werden muss, und keines, das jemand
# aus einem Fork-PR abgreifen kann. Einmal einzurichten, bevor der erste Tag fällt:
#
#   PyPI → Your projects → Publishing → "Add a new pending publisher" (GitHub):
#     PyPI Project Name : tinysesam
#     Owner             : Ollornog
#     Repository name   : TinySesam
#     Workflow name     : release.yml
#     Environment name  : pypi
#
#   Danach im Repo unter Settings → Environments ein Environment `pypi` anlegen. Wer dort
#   "Required reviewers" setzt, bekommt eine zweite Hand vor jeder Veröffentlichung — das
#   GitHub-Release entsteht dann trotzdem, nur der PyPI-Upload wartet auf die Freigabe.
#
# "Pending publisher" heisst: das Projekt gibt es auf PyPI noch nicht. Mit dem ersten
# erfolgreichen Lauf wird daraus ein normaler Publisher. Solange er fehlt, endet der
# Upload-Schritt mit einem 403 — das Release und das Abbild sind davon unberührt.
#
# Beides wird zusätzlich BEGLAUBIGT: Ein Digest belegt, dass sich ein Artefakt seit dem Bau nicht
# verändert hat — nicht, WOHER es kommt. Wer Zugang zur Registry erbeutet, kann ein eigenes Abbild
# unter denselben Tag schieben. Deshalb entsteht hier zu jedem Artefakt eine über Sigstore
# signierte Herkunfts-Attestation (wer hat wann aus welchem Commit gebaut) und eine SBOM (was
# steckt drin). Ohne eigene Schlüssel: signiert wird mit der OIDC-Identität dieses Workflows.
#
#   gh attestation verify oci://ghcr.io/ollornog/tinysesam:vX.Y.Z --owner Ollornog
#   gh attestation verify tinysesam-X.Y.Z-py3-none-any.whl        --owner Ollornog
#
# Vorher prüft der Job, dass der Tag zur Version im Paket passt. Ein Release mit
# falscher Versionsnummer ist schlimmer als keins: es ist unauffällig falsch.
#
# ── Der Knopf (`workflow_dispatch`) ist ein TROCKENLAUF ─────────────────────────────────────
# Von Hand ausgelöst (auf einem Zweig) prüft und baut der Workflow alles, veröffentlicht aber
# nichts: kein Release, kein PyPI-Upload, kein Abbild in der Registry, keine Beglaubigung. Bis
# 2026-09-24 hätte der Knopf nur eines von zwei Dingen getan — am Tag-Vergleich scheitern (bei
# `workflow_dispatch` ist `GITHUB_REF_NAME` ein Zweigname) oder, wäre der Vergleich weg gewesen,
# aus einem Zweig heraus veröffentlichen. Jetzt hängt JEDER veröffentlichende Schritt an
# `github.ref_type == 'tag'`; ohne Tag prüft ein eigener Schritt, was prüfbar ist
# (`scripts/_release.py --pruefen`: Paket, Modul, READMEs, Compose-Beispiel, CHANGELOG). So ist
# der Trockenlauf eine Aussage und nicht „übersprungen" — und der Bau läuft genau so wie beim Tag
# (der Teil, der beim ersten Tag nach zwei Monaten rot war).
#
# ── Derselbe Trockenlauf auf JEDEM Pull Request (seit 2026-09-28) ───────────────────────────
# Updates, die ein Test abnimmt, mergen automatisch (PO-Entscheid 2026-09-28). Die gepinnten
# Bauwerkzeuge (.github/bau), die Sperrliste des Abbilds (deploy/gateway), das Basis-Abbild im
# Dockerfile und die Actions des Baus nahm bis dahin KEIN Pflicht-Check ab — ein Bump, der das
# sdist oder das Abbild bricht, fiel erst beim nächsten Tag auf. Deshalb läuft der Trockenlauf
# auch auf `pull_request`, und seine Jobs `pruefen`, `bauen`, `pruefsummen`, `abbild-probe` und
# `image` sind Pflicht-Checks. Veröffentlicht wird dabei nichts: Bei einem PR ist `ref_type`
# „branch“, jeder veröffentlichende Job hängt am Tag (`tests/test_repo.py` hält beides fest).
# Bis 2026-10-11 nicht abgenommen: die Schritte, die nur beim Tag laufen — GHCR-Anmeldung,
# Beglaubigungen, SBOM, PyPI-Upload. Deren Updates gingen von Hand.
#
# ── GENERALPROBE (seit 2026-10-11, PO: „alles automatisieren ohne dass was bricht“) ─────────────
# Die Jobs `generalprobe*` fahren GENAU diese Actions auf jedem PR — gegen Wegwerf-Ziele auf dem
# Runner (.github/generalprobe): Anmeldung und Push an eine lokale Registry, SBOM aus dem dort
# geschobenen Abbild, Upload von Wheel und sdist an einen lokalen Paket-Server, Beglaubigung einer
# Probedatei. Veröffentlicht wird nichts: kein ghcr, kein PyPI, keine Beglaubigung eines Artefakts.
# Die Probe-Beglaubigung hält `id-token`, aber kein Checkout, kein pip, und ihr Gegenstand ist nur
# `generalprobe.txt` (`tests/test_repo.py` hält das fest). Wer eine Beglaubigung prüft, prüft den
# Tag mit: `gh attestation verify … --owner Ollornog --source-ref refs/tags/vX.Y.Z`.

on:
  push:
    tags: ["v*"]
  pull_request:          # Trockenlauf als Pflicht-Check (siehe oben)
  workflow_dispatch:

permissions:
  contents: read         # Grundrechte knapp halten; jeder Job holt sich, was er braucht

jobs:
  # ── Aufteilung: Wer eine Identität hält, führt keinen fremden Code aus (B4-4 aus T-13) ──────
  # Bis 0.19.0 lief alles in EINEM Job: `pip install -e ".[all]"`, die ganze Suite und
  # `python -m build` — mit `id-token: write` und `contents: write` im selben Job. Jede der rund
  # dreissig installierten Abhängigkeiten hätte damit ein Sigstore-Zertifikat auf die Identität
  # DIESES Workflows ziehen (eine Attestation für ein beliebiges Artefakt fälschen) und Releases
  # anlegen können. Jetzt:
  #   pruefen  — Suite, fremder Code, nur Leserecht
  #   bauen    — Wheel/sdist aus gehashten Bauwerkzeugen, nur Leserecht
  #   release  — kein Checkout, kein pip: lädt das fertige Artefakt, beglaubigt, legt das Release an
  #   pypi     — kein Checkout, kein pip: lädt hoch
  # `tests/test_repo.py` hält das fest: Ein Job mit `id-token: write` oder `contents: write`
  # darf weder das Repo auschecken noch pip, python oder ein Bauwerkzeug starten.
  pruefen:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag gegen die Paketversion prüfen
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject-Version $pkg" >&2
            exit 1
          fi
          echo "Tag und Paketversion stimmen überein: $pkg"

      - name: "Trockenlauf: Versionsstände gegeneinander prüfen (ohne Tag)"
        if: github.ref_type != 'tag'
        run: python3 scripts/_release.py --pruefen

      # Auf einem PR fährt ci.yml dieselbe Suite am selben Commit (Pflicht-Checks `full`,
      # `minimal`, `browser`, `repeat`) — hier noch einmal kostete fünf Minuten Wartezeit.
      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
          # setuptools und wheel gehören dazu: tests/test_packaging.py BAUT das Paket (offline, ohne
          # Isolierung) und überspringt sich ohne Bau-Backend nicht etwa, sondern wird ROT.
          # Genau hier wäre das am teuersten — der Job soll ja prüfen, ob das Paket baut.
          # Aufgefallen beim ersten Tag überhaupt (v0.19.0): 0.18.0 wurde nie getaggt, also lief
          # dieser Job noch nie. Dieselbe Zeile steht seit jeher in scripts/check.sh.
          pip install -e ".[all]" uvicorn httpx setuptools wheel
          python tests/run_all.py --no-browser

  bauen:
    timeout-minutes: 10
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Bit-reproduzierbar (B4-8): Wer denselben Commit mit denselben Bauwerkzeugen baut, bekommt
      # dieselben Prüfsummen wie hier. Drei Zutaten:
      #   - die Werkzeuge gepinnt samt Hashes (.github/bau/requirements.txt) und `--no-isolation`,
      #     sonst holte sich `build` das gerade neueste setuptools;
      #   - `SOURCE_DATE_EPOCH` = Zeitstempel des Commits (Zeitstempel im Wheel);
      #   - beide Artefakte danach normalisiert: das sdist (Zeitstempel, Reihenfolge, Eigentümer,
      #     Rechte, gzip-Kopf), das Wheel (Dateirechte — setuptools übernimmt die des Checkouts,
      #     und die hängen von der umask ab: 0002 auf Ubuntu/Mint, 0022 auf dem Runner).
      # Nachbauen: dieselben drei Schritte auf dem Tag, dann `sha256sum -c SHA256SUMS`.
      # `tests/test_packaging.py` baut zweimal mit verschiedenen Datei-Zeitstempeln und -rechten
      # und vergleicht.
      - name: Pakete bauen
        run: |
          python -m venv "$RUNNER_TEMP/bau"
          "$RUNNER_TEMP/bau/bin/pip" install --require-hashes --no-deps -r .github/bau/requirements.txt
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/bau/bin/python" -m build --no-isolation   # dist/*.whl und dist/*.tar.gz
          python scripts/_artefakte_normalisieren.py dist/*.whl dist/*.tar.gz

      - name: Prüfsummen
        run: cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      # Nur Wheel und sdist wandern zu PyPI: Der Upload-Job lädt alles hoch, was er im
      # Verzeichnis findet, und würde an `SHA256SUMS` scheitern (keine Distribution).
      # Gebaut wird genau EINMAL — das PyPI-Artefakt ist dasselbe, das im Release hängt
      # und dessen Herkunft beglaubigt wird.
      - name: Wheel und sdist weitergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Prüfsummen weitergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pruefsummen
          path: dist/SHA256SUMS
          if-no-files-found: error

  # Die Artefakte so, wie `release` und `pypi` sie bekommen: heruntergeladen und gegen die
  # Prüfsummen gehalten. Das ist dieselbe Probe, die jeder Nutzer macht (`sha256sum -c`), und
  # sie nimmt den Weitergabe-Weg ab — auch auf jedem PR, wo `release` übersprungen ist.
  pruefsummen:
    timeout-minutes: 10
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pruefsummen
          path: dist
      - name: Prüfsummen gegen die heruntergeladenen Artefakte
        run: |
          cd dist
          ls -1 ./*.whl ./*.tar.gz
          sha256sum -c SHA256SUMS

  release:
    timeout-minutes: 10
    needs: [bauen, pruefsummen]
    if: github.ref_type == 'tag'   # veröffentlicht — nie aus einem Trockenlauf
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Release anlegen und Dateien anhängen
      id-token: write      # Sigstore-Identität für die Attestation
      attestations: write  # die Attestation an GitHub übergeben
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pruefsummen
          path: dist

      # Herkunft beglaubigen, BEVOR veröffentlicht wird — über genau die Bytes aus `bauen`.
      - name: Herkunft von Wheel und sdist beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # Bewusst `gh` statt einer Dritt-Action: die bräuchte `contents: write` auf dieses Repo,
      # und ihr Tag liesse sich umhängen. `gh` ist auf den Runnern vorinstalliert. Ohne Checkout
      # kennt `gh` das Repo nicht aus `.git` — deshalb `--repo`.
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  # Der Upload nach PyPI. Bewusst ein EIGENER Job: Er tut nichts, als das fertige Artefakt
  # herunterzuladen und hochzuladen — kein Code aus dem Repo läuft hier. Nur so ist das
  # OIDC-Recht (`id-token: write`), mit dem sich der Workflow gegenüber PyPI ausweist, auf einen
  # Job beschränkt, der nichts Fremdes ausführt. Und erst nach dem Release: Eine Version auf PyPI
  # ist unwiderruflich; ein GitHub-Release liesse sich zurücknehmen.
  pypi:
    timeout-minutes: 10
    needs: release
    if: github.ref_type == 'tag'   # ausdrücklich, nicht nur über das übersprungene `release`
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinysesam
    permissions:
      id-token: write    # die OIDC-Identität, der PyPI vertraut — sonst nichts
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist

      # Ohne `password` greift Trusted Publishing. Die Action legt dabei zusätzlich
      # PEP-740-Attestationen an (Vorgabe `attestations: true`) — dieselbe Herkunftsaussage
      # wie am GitHub-Release, nur direkt neben den Dateien im Index.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true

  # Das Gateway-Abbild. Läuft erst, wenn das Release steht — ein Abbild ohne Release
  # wäre ein Artefakt, zu dem die Notizen fehlen. Gebaut wird OHNE Identität: Der Bau führt
  # pip im Abbild aus, die Beglaubigung macht der Job danach über den Digest.
  # Im Trockenlauf wird das Abbild GEBAUT (beide Plattformen), aber nicht geschoben: `release`
  # ist dann übersprungen, deshalb die ausdrückliche Bedingung statt der stillen Vorgabe.
  # Das Abbild muss STARTEN, bevor es geschoben wird — und auf jedem PR, damit ein Bump der
  # Sperrliste oder des Basis-Abbilds, der erst zur Laufzeit bricht, rot wird. Eigener Job ohne
  # Schreibrecht: Hier läuft der Container, also fremder Code; `image` hält `packages: write`.
  # Gebaut wird für amd64 aus demselben Commit und demselben Dockerfile.
  abbild-probe:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Abbild bauen, starten, HEALTHCHECK und /healthz prüfen
        run: scripts/_abbild_probe.sh

  image:
    timeout-minutes: 30
    needs: [bauen, release, abbild-probe]
    if: >-
      always() && needs.bauen.result == 'success' && needs.abbild-probe.result == 'success' &&
      (needs.release.result == 'success' || github.ref_type != 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read       # Checkout
      packages: write      # Abbild nach GHCR schieben
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # arm64 wird emuliert. Das ist nur erträglich, weil das Abbild ausschließlich das
      # `[gateway]`-Extra installiert (reine Python-Räder). Mit `[all]` müsste hier libxmlsec1
      # kompiliert werden — Minuten statt Sekunden.
      #
      # Beide Actions laden zur Laufzeit ein Werkzeug nach, und ohne Angabe ein WANDERNDES
      # (B4-6): qemu aus dem `latest`-Tag von tonistiigi/binfmt (läuft privilegiert auf dem Runner),
      # BuildKit aus `moby/buildkit:buildx-stable-1`, buildx in der Fassung, die der Runner
      # gerade mitbringt. Der SHA-Pin der Action hält davon nichts fest. Deshalb hier je Werkzeug
      # Version und Digest; `tests/test_repo.py` verlangt sie. Dependabot sieht diese Angaben
      # nicht — beim Heben der Action die Werkzeuge mit heben.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          # Kein Binär-Cache: buildx käme sonst aus dem Actions-Cache, den auch PR-Läufe füllen —
          # im Workflow, der veröffentlicht (zizmor `cache-poisoning`, M6/B1).
          cache-binary: false

      # Container-Registries verlangen kleingeschriebene Repository-Namen; `repository_owner`
      # liefert die Schreibweise des GitHub-Kontos. Groß geschrieben bricht `buildx` ab:
      # `invalid tag …: repository name must be lowercase`.
      - name: Eigentümer kleinschreiben
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Zeitstempel des Commits für den Abbild-Bau (B4-7): BuildKit reicht ihn als Build-Arg
      # durch (Dockerfile: .pyc, /etc/shadow) und schreibt ihn mit `rewrite-timestamp` in jede
      # Ebene. Die Abhängigkeiten legt deploy/gateway/requirements.txt samt Hashes fest.
      - name: Zeitstempel des Commits
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: An GHCR anmelden
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Genau ein Tag, gleich dem Git-Tag. Bewusst KEIN `latest`: ein Tag, der wandert,
          # macht jeden Neustart zum Glücksspiel — dasselbe Compose zöge irgendwann eine
          # andere Version, ohne dass jemand etwas geändert hätte.
          # Im Trockenlauf ein fester Name: Auf einem PR heisst der Ref `108/merge`, auf einem
          # Zweig womöglich `feature/x` — als Abbild-Tag ungültig, der Bau brach daran ab
          # (gefunden am ersten PR mit diesem Trockenlauf). Geschoben wird er ohnehin nie.
          tags: ghcr.io/${{ env.OWNER_LC }}/tinysesam:${{ github.ref_type == 'tag' && github.ref_name || 'trockenlauf' }}
          outputs: type=image,push=${{ github.ref_type == 'tag' }},rewrite-timestamp=true
          provenance: false

  # ── Generalprobe (siehe Kopf) ──────────────────────────────────────────────────────────────────
  # Die Abbilder der Wegwerf-Ziele kommen aus .github/generalprobe/docker-compose.yml (Dependabot
  # hält sie aktuell) — ein `services:`-Abbild direkt im Workflow sähe Dependabot nicht.
  generalprobe-ziele:
    if: github.ref_type != 'tag'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.lesen.outputs.registry }}
      pypi: ${{ steps.lesen.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Abbilder der Wegwerf-Ziele lesen (nur per Digest gepinnt)
        id: lesen
        run: |
          set -euo pipefail
          for dienst in registry pypi; do
            abbild="$(yq -r ".services.${dienst}.image" .github/generalprobe/docker-compose.yml)"
            [[ "$abbild" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "$dienst: $abbild ist nicht per Digest gepinnt"; exit 1; }
            echo "${dienst}=${abbild}" >> "$GITHUB_OUTPUT"
          done

  # Ohne Schreibrecht: Hier läuft fremder Code (Bau, Paket-Server). Gebaut wird nur für amd64 und
  # mit dem Docker-eigenen Builder — `image` baut beide Plattformen schon; hier geht es um Anmeldung,
  # Push, SBOM und Upload.
  generalprobe:
    needs: [bauen, generalprobe-ziele]
    if: github.ref_type != 'tag'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      registry:
        image: ${{ needs.generalprobe-ziele.outputs.registry }}
        ports:
          - "127.0.0.1:5000:5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Der Paket-Server braucht Argumente (Upload ohne Anmeldung), die ein Dienst nicht kennt.
      # Er hängt im Netz des Jobs, damit ihn die Upload-Action (ein Container) als `pypi` erreicht.
      - name: "Generalprobe: Wegwerf-Paketserver starten"
        env:
          ABBILD: ${{ needs.generalprobe-ziele.outputs.pypi }}
        run: |
          set -euo pipefail
          netz="$(docker network ls -q --filter name=github_network_)"
          [ "$(wc -w <<<"$netz")" = "1" ] || { echo "Netz des Jobs nicht eindeutig: '$netz'"; exit 1; }
          befehl="$(yq -r '.services.pypi.command | join(" ")' .github/generalprobe/docker-compose.yml)"
          # shellcheck disable=SC2086  # die Argumente aus der Compose-Datei, bewusst zerlegt
          docker run -d --name pypi --network "$netz" --network-alias pypi -p 127.0.0.1:8080:8080 "$ABBILD" $befehl
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/simple/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/simple/ >/dev/null

      - name: "Generalprobe: an der Wegwerf-Registry anmelden"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: localhost:5000
          username: generalprobe
          password: generalprobe

      - name: "Generalprobe: Abbild bauen und schieben"
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: localhost:5000/tinysesam:generalprobe
          provenance: false

      - name: "Generalprobe: SBOM aus dem geschobenen Abbild"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
        with:
          image: localhost:5000/tinysesam@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist

      - name: "Generalprobe: Wheel und sdist an den Wegwerf-Paketserver"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: http://pypi:8080/
          user: generalprobe
          password: generalprobe
          attestations: false
          print-hash: true

      # Angekommen ist erst, was der Paket-Server ausliefert, und eine SBOM, die das Paket kennt.
      - name: "Generalprobe: Upload und SBOM nachlesen"
        run: |
          set -euo pipefail
          liste="$(curl -fsS http://127.0.0.1:8080/simple/tinysesam/)"
          for datei in dist/*.whl dist/*.tar.gz; do
            grep -qF "$(basename "$datei")" <<<"$liste" || { echo "$(basename "$datei") fehlt auf dem Paket-Server"; exit 1; }
          done
          jq -e '[.packages[].name] | index("tinysesam")' sbom.spdx.json >/dev/null \
            || { echo "SBOM kennt tinysesam nicht"; exit 1; }
          echo "Upload und SBOM stimmen"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: generalprobe-sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # Die Beglaubigung, wie sie `release` und `image-beglaubigen` beim Tag fahren — nur über eine
  # Probedatei. Kein Checkout, kein pip, kein fremder Code außer den beiden Actions selbst.
  generalprobe-beglaubigen:
    needs: generalprobe
    if: github.ref_type != 'tag'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Sigstore-Identität, wie beim Tag
      attestations: write  # die Probe-Beglaubigung an GitHub übergeben
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: generalprobe-sbom
          path: .
      - name: "Generalprobe: Probedatei"
        run: echo "TinySesam Generalprobe ${GITHUB_SHA} — kein Artefakt" > generalprobe.txt
      - name: "Generalprobe: Herkunft beglaubigen"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: generalprobe.txt
      - name: "Generalprobe: SBOM beglaubigen"
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: generalprobe.txt
          sbom-path: sbom.spdx.json

  # Beglaubigung des Abbilds — getrennt vom Bau, aus demselben Grund wie oben: Die Identität
  # liegt nur in einem Job, der weder auscheckt noch baut. Er kennt nur den Digest.
  image-beglaubigen:
    timeout-minutes: 10
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write      # Attestation und SBOM neben das Abbild in die Registry legen
      id-token: write      # Sigstore-Identität für die Attestation
      attestations: write  # Attestation an GitHub übergeben
    steps:
      - name: Eigentümer kleinschreiben
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKits eigene Provenance bleibt aus (`provenance: false` oben): Sie ist UNSIGNIERT und
      # belegt damit genau das nicht, worum es hier geht. Stattdessen eine über Sigstore signierte
      # Attestation, die auch in der Registry neben dem Abbild landet — wer es zieht, kann die
      # Herkunft prüfen, ohne dieses Repo zu kennen.
      - name: Herkunft des Abbilds beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

      # Die SBOM beantwortet die Frage, die nach jeder CVE-Meldung kommt: steckt das Paket drin?
      # Erzeugt wird sie aus dem GESCHOBENEN Abbild (per Digest), nicht aus dem Bauverzeichnis —
      # sonst beschriebe sie etwas anderes als das, was ausgeliefert wurde. Syft lädt die Action
      # selbst nach; die Fassung steht als Konstante im gepinnten Commit der Action (bei diesem
      # SHA v1.51.1) — mit dem SHA-Pin ist sie also festgelegt, anders als qemu/BuildKit oben.
      - name: SBOM aus dem geschobenen Abbild erzeugen
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/${{ env.OWNER_LC }}/tinysesam@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: SBOM beglaubigen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Digest ausgeben (für einen unveränderlichen Pin)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "Abbild: ghcr.io/${OWNER_LC}/tinysesam:${GITHUB_REF_NAME}"
          echo "Digest: ${DIGEST}"
          echo "Unveränderlich pinnen: ghcr.io/${OWNER_LC}/tinysesam@${DIGEST}"
