name: release

# Ein Git-Tag `vX.Y.Z` erzeugt dreierlei:
#   1. ein GitHub-Release mit Wheel, sdist und Prüfsummen
#   2. die Veröffentlichung desselben Wheels und sdists auf PyPI
#   3. ein Container-Abbild `ghcr.io/ollornog/tinysesam:<version>` (für das Gateway)
#
# Das sind die Verteilwege: TinySesam aktualisiert sich nicht selbst, es wird installiert —
# per `pip install tinysesam==<version>`, per gepinntem Tag oder per Abbild-Tag.
#
# Ausgelöst wird das NUR von einem Tag. Es rollt nichts automatisch aus; den Knopf drückt ein
# Mensch, indem er taggt (Continuous Delivery, kein Continuous Deployment).
#
# ── Einmalige Einrichtung auf pypi.org (Trusted Publishing, kein Token) ───────────────────
# Veröffentlicht wird ohne Geheimnis: PyPI vertraut diesem Workflow über dessen OIDC-Identität.
# Damit gibt es kein Token im Repo, keines, das rotiert werden muss, und keines, das jemand
# aus einem Fork-PR abgreifen kann. Einmal einzurichten, bevor der erste Tag fällt:
#
#   PyPI → Your projects → Publishing → "Add a new pending publisher" (GitHub):
#     PyPI Project Name : tinysesam
#     Owner             : Ollornog
#     Repository name   : TinySesam
#     Workflow name     : release.yml
#     Environment name  : pypi
#
#   Danach im Repo unter Settings → Environments ein Environment `pypi` anlegen. Wer dort
#   "Required reviewers" setzt, bekommt eine zweite Hand vor jeder Veröffentlichung — das
#   GitHub-Release entsteht dann trotzdem, nur der PyPI-Upload wartet auf die Freigabe.
#
# "Pending publisher" heisst: das Projekt gibt es auf PyPI noch nicht. Mit dem ersten
# erfolgreichen Lauf wird daraus ein normaler Publisher. Solange er fehlt, endet der
# Upload-Schritt mit einem 403 — das Release und das Abbild sind davon unberührt.
#
# Beides wird zusätzlich BEGLAUBIGT: Ein Digest belegt, dass sich ein Artefakt seit dem Bau nicht
# verändert hat — nicht, WOHER es kommt. Wer Zugang zur Registry erbeutet, kann ein eigenes Abbild
# unter denselben Tag schieben. Deshalb entsteht hier zu jedem Artefakt eine über Sigstore
# signierte Herkunfts-Attestation (wer hat wann aus welchem Commit gebaut) und eine SBOM (was
# steckt drin). Ohne eigene Schlüssel: signiert wird mit der OIDC-Identität dieses Workflows.
#
#   gh attestation verify oci://ghcr.io/ollornog/tinysesam:vX.Y.Z --owner Ollornog
#   gh attestation verify tinysesam-X.Y.Z-py3-none-any.whl        --owner Ollornog
#
# Vorher prüft der Job, dass der Tag zur Version im Paket passt. Ein Release mit
# falscher Versionsnummer ist schlimmer als keins: es ist unauffällig falsch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read         # Grundrechte knapp halten; jeder Job holt sich, was er braucht

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Release anlegen und Dateien anhängen
      id-token: write      # Sigstore-Identität für die Attestation
      attestations: write  # die Attestation an GitHub übergeben
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Tag gegen die Paketversion prüfen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject-Version $pkg" >&2
            exit 1
          fi
          echo "Tag und Paketversion stimmen überein: $pkg"

      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        run: |
          sudo apt-get update && sudo apt-get install -y libxmlsec1-dev pkg-config
          # setuptools und wheel gehören dazu: tests/test_packaging.py BAUT das Paket (offline,
          # ohne Isolierung) und überspringt sich ohne Bau-Backend nicht etwa, sondern wird ROT.
          # Genau hier wäre das am teuersten — der Job soll ja prüfen, ob das Paket baut.
          # Aufgefallen beim ersten Tag überhaupt (v0.19.0): 0.18.0 wurde nie getaggt, also lief
          # dieser Job noch nie. Dieselbe Zeile steht seit jeher in scripts/check.sh.
          pip install -e ".[all]" uvicorn httpx setuptools wheel
          python tests/run_all.py --no-browser

      - name: Pakete bauen
        run: |
          pip install build
          python -m build                       # erzeugt dist/*.whl und dist/*.tar.gz

      - name: Prüfsummen
        run: cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      # Herkunft der Pakete beglaubigen, BEVOR sie veröffentlicht werden.
      - name: Herkunft von Wheel und sdist beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # Bewusst `gh` statt einer Dritt-Action: die bräuchte `contents: write` auf dieses Repo,
      # und ihr Tag liesse sich umhängen. `gh` ist auf den Runnern vorinstalliert.
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

      # Nur Wheel und sdist wandern weiter: Der Upload-Job lädt alles hoch, was er im
      # Verzeichnis findet, und würde an `SHA256SUMS` scheitern (keine Distribution).
      # Gebaut wird genau EINMAL — das PyPI-Artefakt ist dasselbe, das im Release hängt
      # und dessen Herkunft oben beglaubigt wurde.
      - name: Wheel und sdist an den Upload-Job übergeben
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  # Der Upload nach PyPI. Bewusst ein EIGENER Job: Er tut nichts, als das fertige Artefakt
  # herunterzuladen und hochzuladen — kein Code aus dem Repo läuft hier. Nur so ist das
  # OIDC-Recht (`id-token: write`), mit dem sich der Workflow gegenüber PyPI ausweist, auf einen
  # Job beschränkt, der nichts Fremdes ausführt. Und erst nach dem Release: Eine Version auf PyPI
  # ist unwiderruflich; ein GitHub-Release liesse sich zurücknehmen.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinysesam
    permissions:
      id-token: write    # die OIDC-Identität, der PyPI vertraut — sonst nichts
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pypi-dist
          path: dist

      # Ohne `password` greift Trusted Publishing. Die Action legt dabei zusätzlich
      # PEP-740-Attestationen an (Vorgabe `attestations: true`) — dieselbe Herkunftsaussage
      # wie am GitHub-Release, nur direkt neben den Dateien im Index.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true

  # Das Gateway-Abbild. Läuft erst, wenn das Release steht — ein Abbild ohne Release
  # wäre ein Artefakt, zu dem die Notizen fehlen.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      packages: write      # Abbild nach GHCR schieben
      id-token: write      # Sigstore-Identität für die Attestation
      attestations: write  # Attestation an GitHub übergeben (und in die Registry legen)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # arm64 wird emuliert. Das ist nur erträglich, weil das Abbild ausschließlich das
      # `[oidc]`-Extra installiert (reine Python-Räder). Mit `[all]` müsste hier libxmlsec1
      # kompiliert werden — Minuten statt Sekunden.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Container-Registries verlangen kleingeschriebene Repository-Namen; `repository_owner`
      # liefert die Schreibweise des GitHub-Kontos. Groß geschrieben bricht `buildx` ab:
      # `invalid tag …: repository name must be lowercase`.
      - name: Eigentümer kleinschreiben
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Genau ein Tag, gleich dem Git-Tag. Bewusst KEIN `latest`: ein Tag, der wandert,
          # macht jeden Neustart zum Glücksspiel — dasselbe Compose zöge irgendwann eine
          # andere Version, ohne dass jemand etwas geändert hätte.
          tags: ghcr.io/${{ env.OWNER_LC }}/tinysesam:${{ github.ref_name }}
          provenance: false

      # BuildKits eigene Provenance bleibt aus (`provenance: false` oben): Sie ist UNSIGNIERT und
      # belegt damit genau das nicht, worum es hier geht. Stattdessen eine über Sigstore signierte
      # Attestation, die auch in der Registry neben dem Abbild landet — wer es zieht, kann die
      # Herkunft prüfen, ohne dieses Repo zu kennen.
      - name: Herkunft des Abbilds beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Die SBOM beantwortet die Frage, die nach jeder CVE-Meldung kommt: steckt das Paket drin?
      # Erzeugt wird sie aus dem GESCHOBENEN Abbild (per Digest), nicht aus dem Bauverzeichnis —
      # sonst beschriebe sie etwas anderes als das, was ausgeliefert wurde.
      - name: SBOM aus dem geschobenen Abbild erzeugen
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ghcr.io/${{ env.OWNER_LC }}/tinysesam@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: SBOM beglaubigen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Digest ausgeben (für einen unveränderlichen Pin)
        run: |
          echo "Abbild: ghcr.io/${OWNER_LC}/tinysesam:${GITHUB_REF_NAME}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Unveränderlich pinnen: ghcr.io/${OWNER_LC}/tinysesam@${{ steps.push.outputs.digest }}"
