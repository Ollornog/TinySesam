name: release

# A git tag `vX.Y.Z` produces three things:
#   1. a GitHub release with wheel, sdist and checksums
#   2. the publication of the same wheel and sdist on PyPI
#   3. a container image `ghcr.io/ollornog/tinysesam:<version>` (for the gateway)
#
# These are the distribution channels: TinySesam does not update itself, it is installed —
# via `pip install tinysesam==<version>`, via a pinned tag or via an image tag.
#
# This is triggered ONLY by a tag. Nothing rolls out automatically; a human presses the
# button by tagging (continuous delivery, not continuous deployment).
#
# ── One-time setup on pypi.org (trusted publishing, no token) ─────────────────────────────
# Publishing happens without a secret: PyPI trusts this workflow via its OIDC identity.
# So there is no token in the repo, none that has to be rotated, and none that someone could
# grab from a fork PR. To be set up once, before the first tag is cut:
#
#   PyPI → Your projects → Publishing → "Add a new pending publisher" (GitHub):
#     PyPI Project Name : tinysesam
#     Owner             : Ollornog
#     Repository name   : TinySesam
#     Workflow name     : release.yml
#     Environment name  : pypi
#
#   Afterwards, create an environment `pypi` in the repo under Settings → Environments. Anyone who sets
#   "Required reviewers" there gets a second pair of hands before every publication — the
#   GitHub release is still created then, only the PyPI upload waits for the approval.
#
# "Pending publisher" means: the project does not exist on PyPI yet. With the first
# successful run it turns into a normal publisher. As long as it is missing, the
# upload step ends with a 403 — the release and the image are unaffected.
#
# Both are additionally ATTESTED: a digest proves that an artifact has not changed since the
# build — not WHERE it comes from. Anyone who gains access to the registry can push an image of their own
# under the same tag. That is why every artifact gets a provenance attestation signed via
# Sigstore (who built it when, from which commit) and an SBOM (what is
# in it). Without keys of our own: signing uses the OIDC identity of this workflow.
#
#   gh attestation verify oci://ghcr.io/ollornog/tinysesam:vX.Y.Z --owner Ollornog
#   gh attestation verify tinysesam-X.Y.Z-py3-none-any.whl        --owner Ollornog
#
# Beforehand the job checks that the tag matches the version in the package. A release with a
# wrong version number is worse than none: it is inconspicuously wrong.
#
# ── The button (`workflow_dispatch`) is a DRY RUN ───────────────────────────────────────────
# Triggered by hand (on a branch), the workflow checks and builds everything but publishes
# nothing: no release, no PyPI upload, no image in the registry, no attestation. Until
# 2026-09-24 the button would have done only one of two things — fail at the tag comparison (with
# `workflow_dispatch`, `GITHUB_REF_NAME` is a branch name) or, had the comparison been missing,
# publish from a branch. Now EVERY publishing step hangs on
# `github.ref_type == 'tag'`; without a tag, a separate step checks what can be checked
# (`scripts/_release.py --pruefen`: package, module, READMEs, compose example, CHANGELOG). So
# the dry run is a statement and not "skipped" — and the build runs exactly as it does for the tag
# (the part that was red at the first tag after two months).
#
# ── The same dry run on EVERY pull request (since 2026-09-28) ───────────────────────────────
# Updates that a test covers merge automatically (PO decision 2026-09-28). The pinned
# build tools (.github/bau), the lock list of the image (deploy/gateway), the base image in the
# Dockerfile and the actions of the build were covered by NO required check until then — a bump that breaks the
# sdist or the image was only noticed at the next tag. That is why the dry run now also runs
# on `pull_request`, and its jobs `pruefen`, `bauen`, `pruefsummen`, `abbild-probe` and
# `image` are required checks. Nothing is published in the process: on a PR `ref_type` is
# "branch", every publishing job hangs on the tag (`tests/test_repo.py` pins both down).
# Not covered until 2026-10-11: the steps that only run for the tag — GHCR login,
# attestations, SBOM, PyPI upload. Their updates were done by hand.
#
# ── DRESS REHEARSAL (since 2026-10-11, PO: "automate everything without anything breaking") ───
# The jobs `generalprobe*` run EXACTLY these actions on every PR — against throwaway targets on the
# runner (.github/generalprobe): login and push to a local registry, SBOM from the image
# pushed there, upload of wheel and sdist to a local package server, attestation of a
# sample file. Nothing is published: no ghcr, no PyPI, no attestation of an artifact.
# The sample attestation holds `id-token`, but no checkout, no pip, and its subject is only
# `generalprobe.txt` (`tests/test_repo.py` pins that down). Anyone who verifies an attestation verifies the
# tag too: `gh attestation verify … --owner Ollornog --source-ref refs/tags/vX.Y.Z`.

on:
  push:
    tags: ["v*"]
  pull_request:          # dry run as a required check (see above)
  workflow_dispatch:

permissions:
  contents: read         # keep base permissions minimal; each job takes what it needs

jobs:
  # ── Split: whoever holds an identity does not run foreign code (B4-4 from T-13) ─────────────
  # Up to 0.19.0 everything ran in ONE job: `pip install -e ".[all]"`, the whole suite and
  # `python -m build` — with `id-token: write` and `contents: write` in the same job. Each of the roughly
  # thirty installed dependencies could thus have obtained a Sigstore certificate for the identity of
  # THIS workflow (forge an attestation for an arbitrary artifact) and created releases.
  # Now:
  #   pruefen  — suite, foreign code, read permission only
  #   bauen    — wheel/sdist from hashed build tools, read permission only
  #   release  — no checkout, no pip: loads the finished artifact, attests, creates the release
  #   pypi     — no checkout, no pip: uploads
  # `tests/test_repo.py` pins that down: a job with `id-token: write` or `contents: write`
  # must neither check out the repo nor start pip, python or a build tool.
  pruefen:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Tag gegen die Paketversion prüfen
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu pyproject-Version $pkg" >&2
            exit 1
          fi
          echo "Tag und Paketversion stimmen überein: $pkg"

      - name: "Trockenlauf: Versionsstände gegeneinander prüfen (ohne Tag)"
        if: github.ref_type != 'tag'
        run: python3 scripts/_release.py --pruefen

      # On a PR, ci.yml runs the same suite on the same commit (required checks `full`,
      # `minimal`, `browser`, `repeat`) — doing it again here would cost five minutes of waiting.
      - name: Suite fahren, bevor irgendetwas veröffentlicht wird
        if: github.event_name != 'pull_request'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
          # setuptools and wheel are part of it: tests/test_packaging.py BUILDS the package (offline, without
          # isolation) and without a build backend it does not skip itself but turns RED.
          # Right here that would be the most expensive — this job is supposed to check whether the package builds.
          # Noticed at the very first tag (v0.19.0): 0.18.0 was never tagged, so
          # this job had never run. The same line has always been in scripts/check.sh.
          pip install -e ".[all]" uvicorn httpx setuptools wheel
          python tests/run_all.py --no-browser

  bauen:
    timeout-minutes: 10
    needs: pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Bit-reproducible (B4-8): anyone who builds the same commit with the same build tools gets
      # the same checksums as here. Three ingredients:
      #   - the tools pinned with hashes (.github/bau/requirements.txt) and `--no-isolation`,
      #     otherwise `build` would fetch whatever the newest setuptools is;
      #   - `SOURCE_DATE_EPOCH` = timestamp of the commit (timestamps in the wheel);
      #   - both artifacts normalised afterwards: the sdist (timestamps, order, owner,
      #     permissions, gzip header), the wheel (file permissions — setuptools takes over those of the checkout,
      #     and they depend on the umask: 0002 on Ubuntu/Mint, 0022 on the runner).
      # To rebuild: the same three steps on the tag, then `sha256sum -c SHA256SUMS`.
      # `tests/test_packaging.py` builds twice with different file timestamps and permissions
      # and compares.
      - name: Pakete bauen
        run: |
          python -m venv "$RUNNER_TEMP/bau"
          "$RUNNER_TEMP/bau/bin/pip" install --require-hashes --no-deps -r .github/bau/requirements.txt
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/bau/bin/python" -m build --no-isolation   # dist/*.whl and dist/*.tar.gz
          python scripts/_normalize_artifacts.py dist/*.whl dist/*.tar.gz

      - name: Prüfsummen
        run: cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      # Only wheel and sdist go to PyPI: the upload job uploads everything it finds in the
      # directory, and would fail on `SHA256SUMS` (not a distribution).
      # The build happens exactly ONCE — the PyPI artifact is the same one attached to the release
      # and whose provenance is attested.
      - name: Wheel und sdist weitergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pypi-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Prüfsummen weitergeben
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pruefsummen
          path: dist/SHA256SUMS
          if-no-files-found: error

  # The artifacts as `release` and `pypi` receive them: downloaded and held against the
  # checksums. This is the same check every user does (`sha256sum -c`), and
  # it covers the hand-over path — also on every PR, where `release` is skipped.
  pruefsummen:
    timeout-minutes: 10
    needs: bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pruefsummen
          path: dist
      - name: Prüfsummen gegen die heruntergeladenen Artefakte
        run: |
          cd dist
          ls -1 ./*.whl ./*.tar.gz
          sha256sum -c SHA256SUMS

  release:
    timeout-minutes: 10
    needs: [bauen, pruefsummen]
    if: github.ref_type == 'tag'   # publishes — never from a dry run
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and attach files
      id-token: write      # Sigstore identity for the attestation
      attestations: write  # hand the attestation to GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pruefsummen
          path: dist

      # Attest the provenance BEFORE publishing — over exactly the bytes from `bauen`.
      - name: Herkunft von Wheel und sdist beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      # Deliberately `gh` instead of a third-party action: that would need `contents: write` on this repo,
      # and its tag could be moved. `gh` is preinstalled on the runners. Without a checkout
      # `gh` does not know the repo from `.git` — hence `--repo`.
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  # The upload to PyPI. Deliberately a SEPARATE job: it does nothing but download the finished
  # artifact and upload it — no code from the repo runs here. Only this way is the
  # OIDC permission (`id-token: write`) with which the workflow identifies itself to PyPI restricted to a
  # job that runs nothing foreign. And only after the release: a version on PyPI
  # is irrevocable; a GitHub release could be withdrawn.
  pypi:
    timeout-minutes: 10
    needs: release
    if: github.ref_type == 'tag'   # explicit, not only via the skipped `release`
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinysesam
    permissions:
      id-token: write    # the OIDC identity that PyPI trusts — nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist

      # Without `password`, trusted publishing applies. The action additionally creates
      # PEP 740 attestations (default `attestations: true`) — the same provenance statement
      # as on the GitHub release, only directly next to the files in the index.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          print-hash: true

  # The gateway image. Runs only once the release exists — an image without a release
  # would be an artifact without its notes. It is built WITHOUT an identity: the build runs
  # pip inside the image, the job attests afterwards via the digest.
  # In the dry run the image is BUILT (both platforms) but not pushed: `release`
  # is skipped then, hence the explicit condition instead of the silent default.
  # The image must START before it is pushed — and on every PR, so that a bump of the
  # lock list or the base image that only breaks at runtime turns red. Separate job without
  # write permission: the container runs here, i.e. foreign code; `image` holds `packages: write`.
  # Built for amd64 from the same commit and the same Dockerfile.
  abbild-probe:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Abbild bauen, starten, HEALTHCHECK und /healthz prüfen
        run: scripts/_image_probe.sh

  image:
    timeout-minutes: 30
    needs: [bauen, release, abbild-probe]
    if: >-
      always() && needs.bauen.result == 'success' && needs.abbild-probe.result == 'success' &&
      (needs.release.result == 'success' || github.ref_type != 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push the image to GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated. This is only bearable because the image installs nothing but the
      # `[gateway]` extra (pure Python wheels). With `[all]`, libxmlsec1 would have to be
      # compiled here — minutes instead of seconds.
      #
      # Both actions fetch a tool at runtime, and without a specification a MOVING one
      # (B4-6): qemu from the `latest` tag of tonistiigi/binfmt (runs privileged on the runner),
      # BuildKit from `moby/buildkit:buildx-stable-1`, buildx in whatever version the runner
      # happens to ship. The SHA pin of the action fixes none of that. That is why each tool gets
      # version and digest here; `tests/test_repo.py` demands them. Dependabot does not see these
      # entries — when bumping the action, bump the tools too.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
          # No binary cache: otherwise buildx would come from the Actions cache, which PR runs also fill —
          # in the workflow that publishes (zizmor `cache-poisoning`, M6/B1).
          cache-binary: false

      # Container registries require lowercase repository names; `repository_owner`
      # returns the spelling of the GitHub account. With capitals `buildx` aborts:
      # `invalid tag …: repository name must be lowercase`.
      - name: Eigentümer kleinschreiben
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Timestamp of the commit for the image build (B4-7): BuildKit passes it on as a build arg
      # (Dockerfile: .pyc, /etc/shadow) and writes it into every layer with `rewrite-timestamp`.
      # The dependencies are fixed, with hashes, by deploy/gateway/requirements.txt.
      - name: Zeitstempel des Commits
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: An GHCR anmelden
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Exactly one tag, equal to the git tag. Deliberately NO `latest`: a tag that moves
          # makes every restart a gamble — the same compose would eventually pull a
          # different version without anyone having changed anything.
          # A fixed name in the dry run: on a PR the ref is called `108/merge`, on a
          # branch possibly `feature/x` — invalid as an image tag, the build broke on it
          # (found on the first PR with this dry run). It is never pushed anyway.
          tags: ghcr.io/${{ env.OWNER_LC }}/tinysesam:${{ github.ref_type == 'tag' && github.ref_name || 'trockenlauf' }}
          outputs: type=image,push=${{ github.ref_type == 'tag' }},rewrite-timestamp=true
          provenance: false

  # ── Dress rehearsal (see header) ───────────────────────────────────────────────────────────────
  # The images of the throwaway targets come from .github/generalprobe/docker-compose.yml (Dependabot
  # keeps them up to date) — a `services:` image directly in the workflow would be invisible to Dependabot.
  generalprobe-ziele:
    if: github.ref_type != 'tag'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.lesen.outputs.registry }}
      pypi: ${{ steps.lesen.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Abbilder der Wegwerf-Ziele lesen (nur per Digest gepinnt)
        id: lesen
        run: |
          set -euo pipefail
          for dienst in registry pypi; do
            abbild="$(yq -r ".services.${dienst}.image" .github/generalprobe/docker-compose.yml)"
            [[ "$abbild" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "$dienst: $abbild ist nicht per Digest gepinnt"; exit 1; }
            echo "${dienst}=${abbild}" >> "$GITHUB_OUTPUT"
          done

  # Without write permission: foreign code runs here (build, package server). It is built for amd64 only and
  # with Docker's own builder — `image` already builds both platforms; here it is about login,
  # push, SBOM and upload.
  generalprobe:
    needs: [bauen, generalprobe-ziele]
    if: github.ref_type != 'tag'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      registry:
        image: ${{ needs.generalprobe-ziele.outputs.registry }}
        ports:
          - "127.0.0.1:5000:5000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The package server needs arguments (upload without login) that a service does not know.
      # It sits in the network of the job so that the upload action (a container) reaches it as `pypi`.
      - name: "Generalprobe: Wegwerf-Paketserver starten"
        env:
          ABBILD: ${{ needs.generalprobe-ziele.outputs.pypi }}
        run: |
          set -euo pipefail
          netz="$(docker network ls -q --filter name=github_network_)"
          [ "$(wc -w <<<"$netz")" = "1" ] || { echo "Netz des Jobs nicht eindeutig: '$netz'"; exit 1; }
          befehl="$(yq -r '.services.pypi.command | join(" ")' .github/generalprobe/docker-compose.yml)"
          # shellcheck disable=SC2086  # the arguments from the compose file, deliberately split
          docker run -d --name pypi --network "$netz" --network-alias pypi -p 127.0.0.1:8080:8080 "$ABBILD" $befehl
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/simple/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/simple/ >/dev/null

      - name: "Generalprobe: an der Wegwerf-Registry anmelden"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: localhost:5000
          username: generalprobe
          password: generalprobe

      - name: "Generalprobe: Abbild bauen und schieben"
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: localhost:5000/tinysesam:generalprobe
          provenance: false

      - name: "Generalprobe: SBOM aus dem geschobenen Abbild"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        env:
          SYFT_REGISTRY_INSECURE_USE_HTTP: "true"
        with:
          image: localhost:5000/tinysesam@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pypi-dist
          path: dist

      - name: "Generalprobe: Wheel und sdist an den Wegwerf-Paketserver"
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: http://pypi:8080/
          user: generalprobe
          password: generalprobe
          attestations: false
          print-hash: true

      # Only what the package server serves counts as arrived, plus an SBOM that knows the package.
      - name: "Generalprobe: Upload und SBOM nachlesen"
        run: |
          set -euo pipefail
          liste="$(curl -fsS http://127.0.0.1:8080/simple/tinysesam/)"
          for datei in dist/*.whl dist/*.tar.gz; do
            grep -qF "$(basename "$datei")" <<<"$liste" || { echo "$(basename "$datei") fehlt auf dem Paket-Server"; exit 1; }
          done
          jq -e '[.packages[].name] | index("tinysesam")' sbom.spdx.json >/dev/null \
            || { echo "SBOM kennt tinysesam nicht"; exit 1; }
          echo "Upload und SBOM stimmen"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: generalprobe-sbom
          path: sbom.spdx.json
          if-no-files-found: error

  # The attestation as `release` and `image-beglaubigen` run it for the tag — only over a
  # sample file. No checkout, no pip, no foreign code except the two actions themselves.
  generalprobe-beglaubigen:
    needs: generalprobe
    if: github.ref_type != 'tag'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # Sigstore identity, as for the tag
      attestations: write  # hand the sample attestation to GitHub
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: generalprobe-sbom
          path: .
      - name: "Generalprobe: Probedatei"
        run: echo "TinySesam Generalprobe ${GITHUB_SHA} — kein Artefakt" > generalprobe.txt
      - name: "Generalprobe: Herkunft beglaubigen"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: generalprobe.txt
      - name: "Generalprobe: SBOM beglaubigen"
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-path: generalprobe.txt
          sbom-path: sbom.spdx.json

  # Attestation of the image — separate from the build, for the same reason as above: the identity
  # lives only in a job that neither checks out nor builds. It knows only the digest.
  image-beglaubigen:
    timeout-minutes: 10
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      packages: write      # put attestation and SBOM next to the image in the registry
      id-token: write      # Sigstore identity for the attestation
      attestations: write  # hand the attestation to GitHub
    steps:
      - name: Eigentümer kleinschreiben
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: An GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit's own provenance stays off (`provenance: false` above): it is UNSIGNED and
      # thus does not prove exactly what matters here. Instead an attestation signed via Sigstore,
      # which also lands in the registry next to the image — whoever pulls it can verify the
      # provenance without knowing this repo.
      - name: Herkunft des Abbilds beglaubigen
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

      # The SBOM answers the question that follows every CVE report: is the package in there?
      # It is generated from the PUSHED image (by digest), not from the build directory —
      # otherwise it would describe something other than what was shipped. The action fetches Syft
      # itself; the version is a constant in the pinned commit of the action (at this
      # SHA v1.51.1) — so the SHA pin fixes it, unlike qemu/BuildKit above.
      - name: SBOM aus dem geschobenen Abbild erzeugen
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ghcr.io/${{ env.OWNER_LC }}/tinysesam@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: SBOM beglaubigen
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ghcr.io/${{ env.OWNER_LC }}/tinysesam
          subject-digest: ${{ needs.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Digest ausgeben (für einen unveränderlichen Pin)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "Abbild: ghcr.io/${OWNER_LC}/tinysesam:${GITHUB_REF_NAME}"
          echo "Digest: ${DIGEST}"
          echo "Unveränderlich pinnen: ghcr.io/${OWNER_LC}/tinysesam@${DIGEST}"
