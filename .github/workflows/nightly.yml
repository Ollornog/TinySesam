name: nightly (prerelease)

# Python prerelease (3.15) ONLY here, never in the push/PR gate: an RC bug must not block a
# push. Hence continue-on-error — the run informs, it does not judge.
# Rationale: a prerelease problem is information, not a gate (the version matrix lives in ci.yml).
#
# Time: GitHub cron only knows UTC. '30 1 * * *' = 03:30 Europe/Berlin (CEST)
# or 02:30 (CET). Deliberately at night, so that it does not occupy a runner during the day.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# Least privilege. There is no safe default — the initial permission of the
# GITHUB_TOKEN comes from the repo setting. As soon as ONE permission is explicitly
# set, all others fall back to `none`.
permissions:
  contents: read

jobs:
  prerelease:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: System package for SAML (xmlsec)
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxmlsec1-dev pkg-config
      - name: Install (all extras)
        run: pip install -e '.[all]'
      - name: Tests (failure is allowed — prerelease)
        run: python tests/run_all.py
