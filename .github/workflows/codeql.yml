# Statische Analyse (SAST). Bis 0.18.0 lief gar keine — der OpenSSF-Scorecard-Check `SAST`
# hätte 0 gegeben, und für ein Auth-Paket ist das die auffälligste Lücke in der Hygiene.
#
# Öffentliches Repo → `ubuntu-latest`, keine self-hosted Runner: Bei einem Fork-PR liefe sonst
# fremder Code auf eigener Hardware.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Montags früh: CodeQL-Abfragen werden weiterentwickelt, ein Fund kann also auch ohne
    # Codeänderung neu auftauchen.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write      # nur dafür: die Funde in den Security-Reiter schreiben

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: python
          # `security-and-quality` statt der Vorgabe: Das Paket ist klein genug, dass die
          # zusätzlichen Abfragen keine Flut erzeugen.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:python"
