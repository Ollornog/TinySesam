# Static analysis (SAST). Up to 0.18.0 none ran at all — the OpenSSF Scorecard check `SAST`
# would have given 0, and for an auth package that is the most conspicuous gap in hygiene.
#
# Public repo → `ubuntu-latest`, no self-hosted runners: with a fork PR, foreign
# code would otherwise run on our own hardware.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Early on Mondays: CodeQL queries keep evolving, so a finding can also appear anew without a
    # code change.
    - cron: "17 5 * * 1"
  # The follow-up run after a Dependabot auto-merge (dependabot-auto-merge.yml): a merge with the
  # workflow token starts no push run, `workflow_dispatch` is the exception.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write      # only for this: write the findings to the Security tab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: python
          # `security-and-quality` instead of the default: the package is small enough that the
          # additional queries do not produce a flood.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: "/language:python"
