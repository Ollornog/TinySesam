# Static analysis (SAST). Up to 0.18.0 none ran at all — the OpenSSF Scorecard check `SAST`
# would have given 0, and for an auth package that is the most conspicuous gap in hygiene.
#
# Public repo → `ubuntu-latest`, no self-hosted runners: with a fork PR, foreign
# code would otherwise run on our own hardware.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Early on Mondays: CodeQL queries keep evolving, so a finding can also appear anew without a
    # code change.
    - cron: "17 5 * * 1"
  # The follow-up run after a Dependabot auto-merge (dependabot-auto-merge.yml): a merge with the
  # workflow token starts no push run, `workflow_dispatch` is the exception.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write      # only for this: write the findings to the Security tab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: python
          # `security-and-quality` instead of the default: the package is small enough that the
          # additional queries do not produce a flood.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: "/language:python"

  # The Go gate client (clients/go, T-80). A Go analysis needs a build, and a job with `security-events: write` runs no
  # code (tests/test_repo.py, B4-4) — so the analysis runs without that permission and writes SARIF, and the job below
  # only uploads it. Built by hand so that only that module is traced (autobuild would also compile the Caddy image of
  # deploy/forward-auth/caddy-gate, which is not our code).
  analyse-go:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: stable
          cache: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality

      - name: Build the Go gate client
        working-directory: clients/go
        run: go build ./...

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: "/language:go"
          upload: never
          output: sarif-go

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-go-sarif
          path: sarif-go
          retention-days: 3
          if-no-files-found: error

  upload-go:
    name: CodeQL (go) upload
    needs: analyse-go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write      # only for this: write the findings to the Security tab
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: codeql-go-sarif
          path: sarif-go

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: sarif-go
          category: "/language:go"

  # The JS/TS gate client (clients/js, T-82) and the Rust gate client (clients/rust, T-81), in the pattern of the Go
  # jobs: the analysis job holds no write permission (it checks out and, for Rust, runs the toolchain step) and writes
  # SARIF; the upload job holds `security-events: write` and runs no code. Both languages are analysed without a build
  # (`build-mode: none`). Each analysis is limited to its client: the repository has no other JavaScript or Rust file
  # (the built-in pages carry their scripts inside Python templates). Each language gets its own job pair, so a failing
  # extractor of one language does not hide the findings of the other.
  analyse-js:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
          config: |
            paths:
              - clients/js

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: "/language:javascript-typescript"
          upload: never
          output: sarif-js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-js-sarif
          path: sarif-js
          retention-days: 3
          if-no-files-found: error

  upload-js:
    name: CodeQL (javascript-typescript) upload
    needs: analyse-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write      # only for this: write the findings to the Security tab
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: codeql-js-sarif
          path: sarif-js

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: sarif-js
          category: "/language:javascript-typescript"

  analyse-rust:
    name: CodeQL (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The extractor reads the crate through cargo metadata; the runner's rustup may lack a default toolchain.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          languages: rust
          build-mode: none
          queries: security-and-quality
          config: |
            paths:
              - clients/rust

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          category: "/language:rust"
          upload: never
          output: sarif-rust

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-rust-sarif
          path: sarif-rust
          retention-days: 3
          if-no-files-found: error

  upload-rust:
    name: CodeQL (rust) upload
    needs: analyse-rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write      # only for this: write the findings to the Security tab
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: codeql-rust-sarif
          path: sarif-rust

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: sarif-rust
          category: "/language:rust"
