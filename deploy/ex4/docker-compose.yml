# Example Ex4 (T-105): a Node application behind the TinySesam server, surface "headless" — the application draws
# everything, its settings page reads account.json and sends every change to one of TinySesam's action pages.
# Built from THIS checkout: `docker compose up --build` in deploy/ex4, after editing tinysesam.toml and .env (README).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  tinysesam:
    <<: *hardening
    build: ../..
    environment:
      TINYSESAM_CONFIG: /etc/tinysesam.toml
      TINYSESAM_PORT: "8000"
      # With the optional identity provider of tinysesam.toml (README, "With an identity provider"): remove the "#".
      # EX4_OIDC_CLIENT_SECRET: ${EX4_OIDC_CLIENT_SECRET:?the client secret of the provider, in .env}
    volumes:
      - ./tinysesam.toml:/etc/tinysesam.toml:ro
      - tinysesam-data:/data
    networks: [ex4]
    restart: unless-stopped

  caddy:
    <<: *hardening
    build: ../forward-auth/caddy-gate
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TS_TLS: ${TS_TLS:-internal}
      TS_AUTH_HOST: ${TS_AUTH_HOST:-auth.example.com}
      TS_APP_HOST: ${TS_APP_HOST:-app.example.com}
      TS_APP_UPSTREAM: app:9004
    volumes:
      - ../quickstart/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tinysesam
    networks: [ex4]
    restart: unless-stopped

  # The Node application (clients/js/examples/ex4): reads the identity from Caddy only, the settings in the browser.
  app:
    <<: *hardening
    build:
      context: ../../clients/js
      dockerfile: examples/ex4/Dockerfile
    environment:
      TS_LISTEN: "0.0.0.0:9004"
      TS_TRUSTED_PROXY: "172.31.0.0/16"
    networks: [ex4]
    restart: unless-stopped

networks:
  ex4:
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  tinysesam-data:
  caddy-data:
  caddy-config:
