# /etc/fail2ban/jail.d/tinysesam.conf
# IPs, die zu oft fehlschlagen, auf Firewall-Ebene bannen (zusätzlich zum App-Lockout).
#
# App-Seite: TinySesamConfig(security_log="/var/log/tinysesam/security.log") — damit schreibt
# der Logger "tinysesam.security" dorthin, und diese Jail hat etwas zu lesen. Ohne das Feld
# entsteht die Datei nie und die Jail läuft still ins Leere. Das Verzeichnis muss dem
# Dienstbenutzer gehören; ist die Datei nicht schreibbar, sagt TinySesam das beim Start.
[tinysesam]
enabled  = true
filter   = tinysesam
backend  = auto
logpath  = /var/log/tinysesam/security.log
maxretry = 6
findtime = 10m
bantime  = 1h
# port/action nach eurem Setup, z.B.:
# action = %(action_)s
