# /etc/fail2ban/jail.d/tinysesam.conf
# Ban IPs that fail too often at the firewall level (in addition to the app lockout).
#
# App side: TinySesamConfig(security_log="/var/log/tinysesam/security.log") — this makes
# the logger "tinysesam.security" write there, and this jail has something to read. Without the field
# the file is never created and the jail silently runs into nothing. The directory must belong to the
# service user; if the file is not writable, TinySesam says so at startup.
#
# Permissions: TinySesam creates the file with 0640 — also the one newly created after a rotation.
# The lines contain usernames and IP addresses; fail2ban reads them as root, for log
# shipping the group is enough. A logrotate entry for it should set the same permissions,
# e.g. `create 0640 tinysesam adm`. The first-admin one-time token is NOT here (it goes to
# a console on stderr, otherwise into `<db_path>.claim` or `admin_claim_token_file`); up to 0.18.x
# it was here, see CHANGELOG (B5-03).
[tinysesam]
enabled  = true
filter   = tinysesam
backend  = auto
logpath  = /var/log/tinysesam/security.log
maxretry = 6
findtime = 10m
bantime  = 1h
# port/action according to your setup, e.g.:
# action = %(action_)s

# The second jail reads the same file, but the lines with `failed verification` — failures
# that were NOT a sign-in. It is deliberately set to `enabled = false`:
#
# Whoever enables it also bans their own signed-in user who mistypes the old password on
# the account page a few times — and because from the app lockout on (default 5 attempts) every
# further click produces another line, that happens faster than the threshold suggests.
# Enabling is worthwhile for an instance that offers area PINs (`/auth/resource/…`) publicly:
# every visitor may try those. Then preferably with the `ignoreregex` line from
# the filter, which exempts the signed-in paths again.
[tinysesam-verify]
enabled  = false
filter   = tinysesam-verify
backend  = auto
logpath  = /var/log/tinysesam/security.log
maxretry = 15
findtime = 10m
bantime  = 1h
