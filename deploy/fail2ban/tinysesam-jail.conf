# /etc/fail2ban/jail.d/tinysesam.conf
# IPs, die zu oft fehlschlagen, auf Firewall-Ebene bannen (zusätzlich zum App-Lockout).
#
# App-Seite: TinySesamConfig(security_log="/var/log/tinysesam/security.log") — damit schreibt
# der Logger "tinysesam.security" dorthin, und diese Jail hat etwas zu lesen. Ohne das Feld
# entsteht die Datei nie und die Jail läuft still ins Leere. Das Verzeichnis muss dem
# Dienstbenutzer gehören; ist die Datei nicht schreibbar, sagt TinySesam das beim Start.
#
# Rechte: TinySesam legt die Datei mit 0640 an — auch die nach einer Rotation neu entstandene.
# In den Zeilen stehen Benutzernamen und IP-Adressen; fail2ban liest sie als root, für einen
# Log-Versand genügt die Gruppe. Ein logrotate-Eintrag dazu sollte dieselben Rechte setzen,
# z.B. `create 0640 tinysesam adm`. Das Erst-Admin-Einmal-Token steht hier NICHT (es geht auf
# stderr bzw. in `admin_claim_token_file`); bis 0.18.x stand es hier, siehe CHANGELOG (B5-03).
[tinysesam]
enabled  = true
filter   = tinysesam
backend  = auto
logpath  = /var/log/tinysesam/security.log
maxretry = 6
findtime = 10m
bantime  = 1h
# port/action nach eurem Setup, z.B.:
# action = %(action_)s
