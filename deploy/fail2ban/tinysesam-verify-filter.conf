# /etc/fail2ban/filter.d/tinysesam-verify.conf
# The SECOND, milder jail: failures that are NOT a sign-in.
#
# Since the third audit TinySesam logs under its own event word what was a wrongly
# guessed secret but not a sign-in attempt (`security.NICHT_LOGIN_METHODEN`):
#
#   method=password_change   the old-password prompt on the account page
#   method=reauth            the step-up confirmation on /auth/reauth
#   method=resource          the area PIN on /auth/resource/<name> (without an account)
#   method=blocked           plus the rejection once the app lockout already applies
#
# The first two come from someone who is already signed in — there a ban at the
# firewall level is almost always an own goal (see tinysesam-filter.conf). The third is the
# reason this file exists at all: any visitor may try an area PIN,
# and whoever offers it publicly eventually wants to stop the guessing at the packet filter too.
[Definition]
failregex = ^\s*WARNING failed verification user=.* ip=<HOST> method=\S+(?: reason=\S+)?$
# Ban only the area PIN, leave the signed-in paths alone:
#   ignoreregex = .*method=(password_change|reauth)$
ignoreregex =
