# /etc/fail2ban/filter.d/tinysesam-verify.conf
# Die ZWEITE, mildere Jail: Fehlgriffe, die KEINE Anmeldung sind.
#
# TinySesam protokolliert seit dem dritten Audit unter eigenem Ereigniswort, was zwar ein falsch
# geratenes Geheimnis war, aber kein Anmeldeversuch (`security.NICHT_LOGIN_METHODEN`):
#
#   method=password_change   die Alt-Passwort-Abfrage der Kontoseite
#   method=reauth            die Step-up-Bestätigung auf /auth/reauth
#   method=resource          die Bereichs-PIN auf /auth/resource/<name> (ohne Konto)
#   method=blocked           dazu die Abweisung, wenn der App-Lockout schon greift
#
# Die ersten beiden kommen von jemandem, der bereits angemeldet ist — dort ist ein Bann auf
# Firewall-Ebene fast immer ein Eigentor (siehe tinysesam-filter.conf). Die dritte ist der
# Grund, warum es diese Datei überhaupt gibt: Eine Bereichs-PIN darf jeder Besucher probieren,
# und wer sie öffentlich anbietet, will das Raten irgendwann auch am Paketfilter abbrechen.
[Definition]
failregex = ^\s*WARNING failed verification user=.* ip=<HOST> method=\S+(?: reason=\S+)?$
# Nur die Bereichs-PIN bannen, die angemeldeten Wege in Ruhe lassen:
#   ignoreregex = .*method=(password_change|reauth)$
ignoreregex =
