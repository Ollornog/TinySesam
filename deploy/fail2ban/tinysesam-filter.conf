# /etc/fail2ban/filter.d/tinysesam.conf
# Matches the failed attempts logged by TinySesam (logger "tinysesam.security").
# The file comes from TinySesamConfig(security_log="…"); the format carries the timestamp.
# 0.24.9: `INFO repeated login …` (the same wrong password once more, `password_repeat_memory`) and
# `INFO login ok …` (complete sign-in) are in the same file and deliberately do NOT match this failregex.
# 0.24.10: `login ok … unban=yes|no` (up to 0.24.x `ja|nein`). Anyone who wants to lift the IP ban after a sign-in
# (fail2ban-client unban by script) does so ONLY with `unban=yes`: then no failed attempt against another account from this IP was in the window.
# A reset on success via <F-MLFGAINED> is deliberately not built in here: measured with
# fail2ban-regex 1.1.0, a success line of ANOTHER user from the same IP counted as a hit.
[Definition]
# Anchored to the WHOLE line (^…$), not somewhere within it. That keeps hits from fragments
# out and makes the filter more precise.
#
# It is NOT a substitute for sanitising the username (TinySesam since 0.18.0, see
# security.py). Until 2026-09-21 this said the anchoring renders injected lines harmless.
# That is wrong: whoever gets a line break into the username does not write a fragment
# line but a complete, well-formed one — `^…$` matches it just the same, and fail2ban
# bans the IP chosen by the attacker instead of their own. On an older TinySesam version
# this filter therefore does not help against that; there, updating the library is the protection.
#
# This filter matches EXCLUSIVELY `failed login` — real sign-in attempts. Since the third audit
# TinySesam writes failures that are not a sign-in under their own event word
# `failed verification` (old-password prompt on the account page, step-up confirmation,
# area PIN — `security.NOT_LOGIN_METHODS`). The reason is in tinysesam/security.py:
# these lines come from someone who is already signed in, and with `maxretry = 6`
# a legitimate user banned themselves after a few typos on their own account page
# — for the whole instance, not for the route. Anyone who wants to ban those as well adds
# `tinysesam-verify-filter.conf` with the milder jail.
#
# Also deliberately NOT banned: `deferred login … reason=pending`. That is a deferral, not a
# lockout — a sign-in that failed only because of still-open pre-bookings of other sign-ins
# (the LDAP directory is not answering right now). Possibly not a single failed attempt is there afterwards.
failregex = ^\s*WARNING failed login user=.* ip=<HOST> method=\S+(?: reason=\S+)?$
ignoreregex =
