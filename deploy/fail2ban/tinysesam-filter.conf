# /etc/fail2ban/filter.d/tinysesam.conf
# Matcht die von TinySesam geloggten Fehlversuche (Logger "tinysesam.security").
# Die Datei kommt aus TinySesamConfig(security_log="…"); das Format bringt den Zeitstempel mit.
[Definition]
# Auf die GANZE Zeile verankert (^…$), nicht irgendwo darin. Das hält Treffer aus Fragmenten
# heraus und macht den Filter genauer.
#
# Es ist aber KEIN Ersatz für die Bereinigung des Benutzernamens (TinySesam seit 0.18.0, siehe
# security.py). Bis 2026-09-21 stand hier, die Verankerung mache eingeschobene Zeilen unschädlich.
# Das stimmt nicht: Wer einen Zeilenumbruch in den Benutzernamen bekommt, schreibt keine
# Fragmentzeile, sondern eine vollständige, wohlgeformte — die matcht `^…$` genauso, und fail2ban
# bannt die vom Angreifer gewählte IP statt seiner eigenen. Auf einer älteren TinySesam-Fassung
# hilft dieser Filter dagegen also nicht; dort ist das Update der Bibliothek der Schutz.
#
# Dieser Filter matcht AUSSCHLIESSLICH `failed login` — echte Anmeldeversuche. TinySesam
# schreibt Fehlgriffe, die keine Anmeldung sind, seit dem dritten Audit unter dem eigenen Ereigniswort
# `failed verification` (Alt-Passwort-Abfrage der Kontoseite, Step-up-Bestätigung,
# Bereichs-PIN — `security.NICHT_LOGIN_METHODEN`). Der Grund steht in tinysesam/security.py:
# Diese Zeilen stammen von jemandem, der bereits angemeldet ist, und mit `maxretry = 6`
# bannte sich ein legitimer Nutzer nach ein paar Tippfehlern auf der eigenen Kontoseite
# selbst — für die ganze Instanz, nicht für die Route. Wer auch sie bannen will, nimmt
# zusätzlich `tinysesam-verify-filter.conf` mit der milderen Jail dazu.
failregex = ^\s*WARNING failed login user=.* ip=<HOST> method=\S+(?: reason=\S+)?$
ignoreregex =
