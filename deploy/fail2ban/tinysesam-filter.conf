# /etc/fail2ban/filter.d/tinysesam.conf
# Matcht die von TinySesam geloggten Fehlversuche (Logger "tinysesam.security").
# Die Datei kommt aus TinySesamConfig(security_log="…"); das Format bringt den Zeitstempel mit.
[Definition]
# Auf die GANZE Zeile verankert (^…$), nicht irgendwo darin.
#
# Zweite Verteidigungslinie: TinySesam bereinigt den Benutzernamen seit 0.18.0, bevor er ins Log
# geht. Ohne die Verankerung würde eine eingeschobene, datumslose Zeile trotzdem zählen —
# fail2ban übernimmt für solche Zeilen den Zeitstempel der vorhergehenden. Mit `^…$` zählt sie
# nicht mehr. Wer eine ältere TinySesam-Fassung fährt, sollte diesen Filter deshalb übernehmen.
failregex = ^\s*WARNING failed login user=.* ip=<HOST> method=\S+(?: reason=\S+)?$
ignoreregex =
