# Example Ex1 (T-97): the TinySesam server with local accounts in front of a Go application (clients/go/examples/ex1).
# Read by the gateway image through TINYSESAM_CONFIG (deploy/ex1/docker-compose.yml). Every key is a field of
# TinySesamConfig (CONFIGURATION.md); secrets only as "env:NAME" or <field>_file. Hosts: replace auth.example.com
# and app.example.com with yours (the compose file passes them to Caddy too).
db_path = "/data/ex1.db"
base_url = "https://auth.example.com"
trusted_redirect_hosts = ["app.example.com"]
trusted_proxies = ["172.30.0.0/16"]
https_mode = "warn"                 # TLS ends at Caddy in front

# Local accounts: password, TOTP, the account page, the admin panel. The first administrator claims the panel with
# the one-time token the server writes next to the database (`/data/ex1.db.claim`, see the README).
password_enabled = true
totp_enabled = true
account_enabled = true
admin_enabled = true
magiclink_enabled = true             # the account API's one-time sign-in links
apikey_enabled = true                # the service account's automation key
available_roles = ["ex1-member", "ex1-staff"]

# Forward auth for the application's host: the proxy asks TinySesam on every request and passes Remote-* on.
forward_auth_enabled = true

# T-103, surface "shell on top": the application's pages load TinySesam's shell component (/.tinysesam/shell.js). The
# app frame gives it the application's name, the way home and the links — Members for holders of ex1.members.read,
# Staff for the role ex1-staff (visibility is a convenience: the Go program checks both itself).
[forward_apps."app.example.com"]
name = "Ex1"
home = "/"
links = [["Home", "/"],
         ["Members", "/members", { permission = "ex1.members.read", app = "ex1" }],
         ["Staff", "/staff", { role = "ex1-staff" }]]

# The application's account API (spec/provisioning-api.md): its service account svc-ex1 creates and manages the
# people of ex1-member, nothing else.
# T-101: the application is served on app.example.com, so forward auth sends the account's permissions for ex1 along
# (Remote-Permissions); its service account registers the manifest at start (permissions:register). An administrator
# assigns ex1.members.read and ex1.members.invite to roles in the panel (Accounts → Permissions).
[apps.ex1]
account = "svc-ex1"
name = "Ex1"
hosts = ["app.example.com"]
permission_scopes = ["permissions:register"]
layout = "top"                       # the shell on the application's hosts (T-103); "side" puts it at the left

[apps.ex1.provisioning]
roles = ["ex1-member"]
scopes = ["users:read", "users:invite", "users:update", "users:disable"]
