# Example Ex1 (T-97): a Go application behind the TinySesam server with local accounts — sign-in, admin panel and
# account API without a line of Python in the application. Built from THIS checkout (the configuration file needs a
# release after 0.31.0): `docker compose up --build` in deploy/ex1, after editing tinysesam.toml and .env (README).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  tinysesam:
    <<: *hardening
    build: ../..
    environment:
      TINYSESAM_CONFIG: /etc/tinysesam.toml
      TINYSESAM_PORT: "8000"
      # With the optional identity provider of tinysesam.toml (README, "With an identity provider"): remove the "#".
      # EX1_OIDC_CLIENT_SECRET: ${EX1_OIDC_CLIENT_SECRET:?the client secret of the provider, in .env}
    volumes:
      - ./tinysesam.toml:/etc/tinysesam.toml:ro
      - tinysesam-data:/data
    networks: [ex1]
    restart: unless-stopped

  caddy:
    <<: *hardening
    build: ../forward-auth/caddy-gate
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TS_TLS: ${TS_TLS:-internal}
      TS_AUTH_HOST: ${TS_AUTH_HOST:-auth.example.com}
      TS_APP_HOST: ${TS_APP_HOST:-app.example.com}
      TS_APP_UPSTREAM: app:9000
    volumes:
      - ../quickstart/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tinysesam
    networks: [ex1]
    restart: unless-stopped

  # The Go application (clients/go/examples/ex1): reads the identity from the Remote-* headers of Caddy only, and
  # manages its people through the account API with the service account's automation key (TS_API_KEY in .env).
  app:
    <<: *hardening
    build:
      context: ../../clients/go
      dockerfile: examples/ex1/Dockerfile
    environment:
      TS_AUTH_URL: https://${TS_AUTH_HOST:-auth.example.com}
      TS_API_KEY: ${TS_API_KEY:-}
      TS_API_URL: http://tinysesam:8000
      TS_LISTEN: "0.0.0.0:9000"
      TS_TRUSTED_PROXY: "172.30.0.0/16"
    networks: [ex1]
    restart: unless-stopped

networks:
  ex1:
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  tinysesam-data:
  caddy-data:
  caddy-config:
