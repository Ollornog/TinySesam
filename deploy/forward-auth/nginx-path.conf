# TinySesam forward-auth with nginx — ONE host, individual paths protected.
#
# The other common layout besides nginx.conf: no separate auth subdomain, no
# upstream app on :9000, but a grown site (static files + PHP-FPM) in which
# only individual folders sit behind the login. TinySesam runs on the same host under /auth/.
#
# Prerequisite in TinySesamConfig:
#   forward_auth_enabled=True
#   base_url="https://example.com"      # the same host as the site
#   cookie_domain=""                    # host-only is enough — there is only one host
#   trusted_proxies=["127.0.0.1/32"]
# trusted_redirect_hosts is NOT needed here: the host of the own base_url is always an
# allowed next= target.
#
# ── Three traps this layout sets ─────────────────────────────────────────────────────────────
#  (1) `location ^~ /intern/` switches off the server's REGEX locations. A server-wide
#      `location ~ /\.` no longer applies there — .env and .git would be served in
#      the protected folder of all places. That is why the dotfile block below appears ONCE MORE
#      inside the protected block.
#  (2) `proxy_set_header Remote-User` does not reach PHP-FPM. FastCGI knows no proxy headers;
#      it needs `fastcgi_param HTTP_REMOTE_USER` (in PHP then $_SERVER['HTTP_REMOTE_USER']).
#  (3) The Remote-* headers must also be set (emptied) in the OPEN locations, otherwise
#      a client simply sends them along itself and the app believes it.
#
# All three were reproduced (nginx 1.31 + php-fpm 8.3): without (1) /intern/.env returns a 200
# with content, without (2) HTTP_REMOTE_USER stays empty in PHP, without (3) a `Remote-User: root`
# sent along arrives as $_SERVER['HTTP_REMOTE_USER'].

# ── TinySesam cookies must not reach the app (B-20) ──────────────────────────────────────────
# The browser sends the session cookie (and the approval cookie tinysesam_runlock) to every
# host under cookie_domain. Unfiltered, every protected app read it along: a compromised
# or simply chatty app (debug page, error report, log with request headers) thereby leaked
# a session valid for ALL apps and the account at TinySesam. The app needs neither
# of them — who is signed in is told to it by the Remote-* headers.
# nginx cannot "replace all occurrences" in a header; each stage below removes ONE
# `tinysesam_*` cookie (also with the __Host-/__Secure- prefix). How many a browser carries
# is not fixed: after the switch to `__Host-` the old names sit alongside until they expire
# or TinySesam deletes them at the next sign-in; plus flow cookies of sign-ins in progress
# and renamed cookies of several instances. The chain is therefore long enough for every name
# twice over, and behind it sits a latch: if a tinysesam cookie is STILL left afterwards, no
# cookie at all goes to the app (fail closed) — better that in this edge case it loses its own
# cookies than that a session slips through. The last stage removes a leftover
# leading `; `. To add stages: append a line following the pattern, move the latch onto it.
# Other cookies stay untouched. Renamed cookies (session_cookie=…, resource_cookie=…,
# csrf_cookie=…) must be added to the pattern here. `map` belongs in the http context — this file is
# included from conf.d/ into http{} as usual; the variable names may occur only once.
map $http_cookie $ts_ck1 { "~^(?<ts1a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts1b>.*)$" "$ts1a$ts1b"; default $http_cookie; }
map $ts_ck1 $ts_ck2 { "~^(?<ts2a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts2b>.*)$" "$ts2a$ts2b"; default $ts_ck1; }
map $ts_ck2 $ts_ck3 { "~^(?<ts3a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts3b>.*)$" "$ts3a$ts3b"; default $ts_ck2; }
map $ts_ck3 $ts_ck4 { "~^(?<ts4a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts4b>.*)$" "$ts4a$ts4b"; default $ts_ck3; }
map $ts_ck4 $ts_ck5 { "~^(?<ts5a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts5b>.*)$" "$ts5a$ts5b"; default $ts_ck4; }
map $ts_ck5 $ts_ck6 { "~^(?<ts6a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts6b>.*)$" "$ts6a$ts6b"; default $ts_ck5; }
map $ts_ck6 $ts_ck7 { "~^(?<ts7a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts7b>.*)$" "$ts7a$ts7b"; default $ts_ck6; }
map $ts_ck7 $ts_ck8 { "~^(?<ts8a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts8b>.*)$" "$ts8a$ts8b"; default $ts_ck7; }
map $ts_ck8 $ts_ck9 { "~^(?<ts9a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts9b>.*)$" "$ts9a$ts9b"; default $ts_ck8; }
map $ts_ck9 $ts_ck10 { "~^(?<ts10a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts10b>.*)$" "$ts10a$ts10b"; default $ts_ck9; }
map $ts_ck10 $ts_ck11 { "~^(?<ts11a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts11b>.*)$" "$ts11a$ts11b"; default $ts_ck10; }
map $ts_ck11 $ts_ck12 { "~^(?<ts12a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts12b>.*)$" "$ts12a$ts12b"; default $ts_ck11; }
map $ts_ck12 $ts_ck_latch { "~^(?:.*;\s*)?(?:__Host-|__Secure-)?tinysesam_[^=;]*=" ""; default $ts_ck12; }
map $ts_ck_latch $ts_app_cookie { "~^[;\s]+(?<tsrest>.*)$" "$tsrest"; default $ts_ck_latch; }

server {
    listen 443 ssl;
    server_name example.com;
    root /var/www/example;
    index index.php index.html;

    # ── Internal sub-request to TinySesam ───────────────────────────────────────────────────
    location = /auth/forward {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;   # not the client's (see nginx.conf)
        proxy_set_header Cookie $http_cookie;
    }

    # Variant with role enforcement: a separate internal endpoint per role. The query string is in
    # THIS file, not with the client — nginx does not append the client's query to a sub-request.
    # TinySesam answers 403 (not 401) when signed in but the role is missing.
    location = /auth/forward-editors {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward?roles=editors,admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;   # not the client's (see nginx.conf)
        proxy_set_header Cookie $http_cookie;
    }

    # ── TinySesam itself (login page, callbacks, account) — must be openly reachable ─────────
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ── Protected folder ────────────────────────────────────────────────────────────────────
    location ^~ /intern/ {
        auth_request /auth/forward;
        # …or with role enforcement:  auth_request /auth/forward-editors;

        auth_request_set $ts_user   $upstream_http_remote_user;
        auth_request_set $ts_name   $upstream_http_remote_name;
        auth_request_set $ts_email  $upstream_http_remote_email;
        auth_request_set $ts_groups $upstream_http_remote_groups;
        auth_request_set $ts_login  $upstream_http_x_tinysesam_location;
        error_page 401 = @tinysesam_login;
        # 403 = signed in, but role missing. Do NOT send to the login (nothing changes there).
        error_page 403 = @tinysesam_denied;

        # (1) Dotfiles: repeat here, because ^~ switches off the regex locations.
        location ~ /\. { deny all; }

        # PHP in the protected folder
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            # (2) FastCGI instead of proxy_set_header — otherwise the variable silently stays empty in PHP.
            fastcgi_param HTTP_REMOTE_USER   $ts_user;
            fastcgi_param HTTP_REMOTE_NAME   $ts_name;
            fastcgi_param HTTP_REMOTE_EMAIL  $ts_email;
            fastcgi_param HTTP_REMOTE_GROUPS $ts_groups;
            # Without the TinySesam cookies (B-20, map above) — PHP does not need them.
            fastcgi_param HTTP_COOKIE        $ts_app_cookie;
        }
    }

    # ── Open remainder ──────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        # (3) EMPTY them here: without these four lines a client can simply send "Remote-User: admin"
        # along itself, and PHP would see it as $_SERVER['HTTP_REMOTE_USER'].
        fastcgi_param HTTP_REMOTE_USER   "";
        fastcgi_param HTTP_REMOTE_NAME   "";
        fastcgi_param HTTP_REMOTE_EMAIL  "";
        fastcgi_param HTTP_REMOTE_GROUPS "";
        # Here too without the TinySesam cookies (B-20): the same host means the browser sends
        # them to every open script as well — and that is often the least maintained one.
        fastcgi_param HTTP_COOKIE        $ts_app_cookie;
    }

    location @tinysesam_login  { return 302 $ts_login; }
    location @tinysesam_denied { return 403 "Access denied: missing role."; }
}
