# TinySesam forward auth with Traefik (ForwardAuth middleware), dynamic configuration.
#
# Prerequisite in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (see the Caddyfile comment).
#
# Other header names (e.g. X-WEBAUTH-USER for Grafana): set TinySesamConfig(forward_headers={...})
# — and CARRY the names over to authResponseHeaders here. Traefik only passes through what is
# listed there; a renamed header that is missing here never reaches the app.
#
# Note: Traefik does not follow the 401 automatically. For browsers to be redirected to the login,
# either evaluate the X-TinySesam-Location header in the client or add a 401 error-page router.
# The Remote-* headers are passed on to the app via authResponseHeaders.
#
# Cookies to the app (B-20) — a gap remains here that only the operator can close:
# The browser sends the session cookie `tinysesam_session` (and `tinysesam_runlock`) to every
# host under cookie_domain, and Traefik passes it on to the app. A compromised or chatty app
# (debug page, error report, log with request headers) thus leaks a session that is valid for
# ALL apps. Caddy and nginx (templates next to this one) strip the TinySesam cookies
# selectively; Traefik cannot do that with built-in means — the headers middleware only sets or
# deletes the WHOLE Cookie header. Therefore:
#   * If the app needs no cookies of its own: put the middleware `tinysesam-cookies-weg` (below)
#     into the chain AFTER `tinysesam-auth`. The order matters — before it, the check would not see a cookie either.
#   * If it needs its own cookies: a plugin that removes individual cookies, or Caddy/nginx
#     in front of the app. Without one of the two, the gap remains.

http:
  middlewares:
    tinysesam-auth:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"

    # The same check, but with a role requirement: a second middleware that carries the query
    # parameter (one of the listed roles is enough). TinySesam answers 403 instead of 200 if
    # someone is signed in but lacks the role — deliberately not a 401, which would send them to
    # the login and from there back here with the same missing role.
    tinysesam-auth-redaktion:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward?roles=redaktion,admin"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"

    # Deletes the whole Cookie header on the way to the app (empty value = remove). Only for apps
    # without cookies of their own — see B-20 above.
    tinysesam-cookies-weg:
      headers:
        customRequestHeaders:
          Cookie: ""

  routers:
    app:
      rule: "Host(`app.example.com`)"
      middlewares:
        - tinysesam-auth
        # - tinysesam-cookies-weg   # only for apps without cookies of their own (B-20), always AFTER the check
      service: app-svc

    auth:
      rule: "Host(`auth.example.com`)"
      service: tinysesam-svc

  services:
    app-svc:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"
    tinysesam-svc:
      loadBalancer:
        servers:
          - url: "http://tinysesam:8000"
