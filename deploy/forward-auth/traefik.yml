# TinySesam forward auth with Traefik (ForwardAuth middleware), dynamic configuration.
#
# Prerequisite in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (see the Caddyfile comment).
#
# Other header names (e.g. X-WEBAUTH-USER for Grafana): set TinySesamConfig(forward_headers={...})
# — and CARRY the names over to authResponseHeaders here. Traefik only passes through what is
# listed there; a renamed header that is missing here never reaches the app.
#
# Note: Traefik does not follow the 401 automatically. For browsers to be redirected to the login,
# either evaluate the X-TinySesam-Location header in the client or add a 401 error-page router.
# The Remote-* headers are passed on to the app via authResponseHeaders. Traefik first deletes every listed header
# from the request and then copies TinySesam's value — so a Remote-* the browser sends never reaches the app, as
# long as its name is listed, also when TinySesam sends no value for it (measured with Traefik 3.7 in
# tests/test_proxies.py). List every header of TinySesam.FORWARD_HEADERS_DEFAULT (Remote-Auth since T-75, Remote-Kind since spec v2).
#
# REQUIRED in the STATIC configuration (traefik.yml / command line), not here: delete headers whose name ALIASES
# another one. A browser sending `Remote_User: admin` or `Remote.User: admin` gets past authResponseHeaders (another
# name), and a CGI/WSGI/PHP backend reads both as HTTP_REMOTE_USER — next to or instead of TinySesam's value:
#
#   entryPoints:
#     websecure:
#       http:
#         aliasHeadersStrategy: delete     # or for every entry point: global.aliasHeadersStrategy: delete
#
# (Traefik ≥ 3.6 warns at start while it is unset. nginx drops such headers by default: underscores_in_headers off.)
#
# Caddy is the recommended proxy (the gate token spares TinySesam most requests); with Traefik every request goes
# through /auth/forward.
#
# Cookies to the app (B-20) — a gap remains here that only the operator can close:
# The browser sends the session cookie `tinysesam_session` (and `tinysesam_runlock`) to every
# host under cookie_domain, and Traefik passes it on to the app. A compromised or chatty app
# (debug page, error report, log with request headers) thus leaks a session that is valid for
# ALL apps. Caddy and nginx (templates next to this one) strip the TinySesam cookies
# selectively; Traefik cannot do that with built-in means — the headers middleware only sets or
# deletes the WHOLE Cookie header. Therefore:
#   * If the app needs no cookies of its own: put the middleware `tinysesam-strip-cookies` (below)
#     into the chain AFTER `tinysesam-auth`. The order matters — before it, the check would not see a cookie either.
#   * If it needs its own cookies: a plugin that removes individual cookies, or Caddy/nginx
#     in front of the app. Without one of the two, the gap remains.

http:
  middlewares:
    tinysesam-auth:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward"
        # Only the proxy names the target (attack round B, F1). `trustForwardHeader: false` makes Traefik write
        # X-Forwarded-Host/-Proto/-Uri/-Method itself instead of keeping a browser's, and `authRequestHeaders` passes
        # on only what TinySesam needs to decide — without the list Traefik copies EVERY header of the browser,
        # X-Original-URL included, which up to 0.25 moved the check to another host. A renamed API-key or
        # session header must be added here.
        trustForwardHeader: false
        authRequestHeaders:
          - "Accept"
          - "Authorization"
          - "Cookie"
          - "Sec-Fetch-Dest"
          - "Sec-Fetch-Mode"
          - "Sec-Fetch-Site"
          - "Sec-Fetch-User"
          - "User-Agent"
          - "X-Api-Key"
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"
          - "Remote-Auth"
          - "Remote-Kind"

    # The same check, but with a role requirement: a second middleware that carries the query
    # parameter (one of the listed roles is enough). TinySesam answers 403 instead of 200 if
    # someone is signed in but lacks the role — deliberately not a 401, which would send them to
    # the login and from there back here with the same missing role.
    tinysesam-auth-editors:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward?roles=editors,admin"
        trustForwardHeader: false          # F1, see tinysesam-auth
        authRequestHeaders: ["Accept", "Authorization", "Cookie", "Sec-Fetch-Dest", "Sec-Fetch-Mode",
                             "Sec-Fetch-Site", "Sec-Fetch-User", "User-Agent", "X-Api-Key"]
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"
          - "Remote-Auth"
          - "Remote-Kind"

    # HSTS (ASVS 3.4.1) on both routers: one year, also for subdomains OF THE HOST — never for its siblings or
    # the parent domain. No preload: the browsers' preload list is hard to leave again. Traefik sets no HSTS
    # by itself.
    tinysesam-hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true

    # The client's credentials end here (attack round 2026-11-21, A-3): TinySesam has decided, the app trusts
    # Remote-*. An app password, an OAuth access token or an API key (`tsk_…`, valid at every host and at
    # TinySesam's own API) must not reach a debug page, an error report or a header log of the app. Always AFTER
    # `tinysesam-auth` in the chain — the check itself needs them. Your app checks Authorization ITSELF (its own
    # Basic auth behind the gate)? Then leave this middleware out for that router — deliberately (SECURITY.md,
    # "Credentials at the application").
    tinysesam-strip-credentials:
      headers:
        customRequestHeaders:
          Authorization: ""
          X-Api-Key: ""

    # Only the proxy names the target, also towards the app (F1, measured in tests/test_proxies.py): Traefik passes
    # every header of the client on, so an X-Original-URL the browser made up reached the app — one that builds
    # addresses or decides from it followed the browser. First in the chain.
    tinysesam-strip-client:
      headers:
        customRequestHeaders:
          X-Original-URL: ""
          X-Original-URI: ""

    # Deletes the whole Cookie header on the way to the app (empty value = remove). Only for apps
    # without cookies of their own — see B-20 above.
    tinysesam-strip-cookies:
      headers:
        customRequestHeaders:
          Cookie: ""

  routers:
    app:
      rule: "Host(`app.example.com`)"
      middlewares:
        - tinysesam-hsts
        - tinysesam-strip-client        # BEFORE the check: the client's X-Original-URL never reaches the app
        - tinysesam-auth
        - tinysesam-strip-credentials   # AFTER the check (A-3)
        # - tinysesam-strip-cookies   # only for apps without cookies of their own (B-20), always AFTER the check
      service: app-svc

    # TinySesam's paths on the app's host — the sign-out at the app (T-22: /.tinysesam/logout, /.tinysesam/after-logout)
    # and the top bar as data for the app's page (T-76: /.tinysesam/topbar.json). Past the check (signing out must work
    # with an expired sign-in too) and with the browser's cookies: they are the credential there. The longer rule wins
    # over `app` by Traefik's default priority (rule length).
    app-tinysesam:
      rule: "Host(`app.example.com`) && PathPrefix(`/.tinysesam/`)"
      middlewares:
        - tinysesam-hsts
        - tinysesam-strip-client
      service: tinysesam-svc

    auth:
      rule: "Host(`auth.example.com`)"
      middlewares:
        - tinysesam-hsts
      service: tinysesam-svc

  services:
    app-svc:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"
    tinysesam-svc:
      loadBalancer:
        servers:
          - url: "http://tinysesam:8000"
