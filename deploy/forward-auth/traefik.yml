# TinySesam Forward-Auth mit Traefik (ForwardAuth-Middleware), dynamische Konfiguration.
#
# Voraussetzung in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (siehe Caddyfile-Kommentar).
#
# Andere Header-Namen (z.B. X-WEBAUTH-USER für Grafana): TinySesamConfig(forward_headers={...})
# setzen — und die Namen hier unter authResponseHeaders MITZIEHEN. Traefik reicht nur durch, was
# dort steht; ein umbenannter Header, der hier fehlt, kommt bei der App nie an.
#
# Hinweis: Traefik folgt der 401 nicht automatisch. Damit Browser zum Login umgeleitet werden,
# entweder im Client den Header X-TinySesam-Location auswerten oder einen 401-Errorpage-Router
# ergänzen. Die Remote-*-Header werden via authResponseHeaders an die App durchgereicht.
#
# Cookies an die App (B-20) — hier bleibt eine Lücke, die nur der Betreiber schliessen kann:
# Der Browser schickt das Sitzungs-Cookie `tinysesam_session` (und `tinysesam_runlock`) an jeden
# Host unter cookie_domain, und Traefik reicht es an die App durch. Eine kompromittierte oder
# geschwätzige App (Debug-Seite, Fehlerbericht, Log mit Anfrage-Headern) gibt damit eine Sitzung
# heraus, die für ALLE Apps gilt. Caddy und nginx (Vorlagen daneben) nehmen die TinySesam-Cookies
# gezielt heraus; Traefik kann das mit Bordmitteln nicht — die Headers-Middleware setzt oder
# löscht nur den GANZEN Cookie-Header. Deshalb:
#   * Braucht die App keine eigenen Cookies: Middleware `tinysesam-cookies-weg` (unten) NACH
#     `tinysesam-auth` in die Kette. Die Reihenfolge zählt — davor sähe auch die Prüfung kein Cookie.
#   * Braucht sie eigene Cookies: ein Plugin, das einzelne Cookies entfernt, oder Caddy/nginx
#     vor die App. Ohne eins von beiden bleibt es bei der Lücke.

http:
  middlewares:
    tinysesam-auth:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"

    # Dieselbe Prüfung, aber mit Rollenzwang: eine zweite Middleware, die den Query-Parameter
    # mitbringt (eine der genannten Rollen genügt). TinySesam antwortet 403 statt 200, wenn
    # jemand angemeldet ist, aber die Rolle fehlt — bewusst kein 401, der schickte ihn zum
    # Login und von dort mit derselben fehlenden Rolle wieder hierher.
    tinysesam-auth-redaktion:
      forwardAuth:
        address: "http://tinysesam:8000/auth/forward?roles=redaktion,admin"
        trustForwardHeader: true
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
          - "Remote-Id"

    # Löscht den ganzen Cookie-Header auf dem Weg zur App (leerer Wert = entfernen). Nur für Apps
    # ohne eigene Cookies — siehe B-20 oben.
    tinysesam-cookies-weg:
      headers:
        customRequestHeaders:
          Cookie: ""

  routers:
    app:
      rule: "Host(`app.example.com`)"
      middlewares:
        - tinysesam-auth
        # - tinysesam-cookies-weg   # nur für Apps ohne eigene Cookies (B-20), immer NACH der Prüfung
      service: app-svc

    auth:
      rule: "Host(`auth.example.com`)"
      service: tinysesam-svc

  services:
    app-svc:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"
    tinysesam-svc:
      loadBalancer:
        servers:
          - url: "http://tinysesam:8000"
