# TinySesam Forward-Auth mit nginx — EIN Host, einzelne Pfade geschützt.
#
# Der andere verbreitete Zuschnitt neben nginx.conf: keine eigene Auth-Subdomain, keine
# Upstream-App auf :9000, sondern eine gewachsene Site (statische Dateien + PHP-FPM), bei der
# nur einzelne Ordner hinter dem Login liegen. TinySesam läuft auf demselben Host unter /auth/.
#
# Voraussetzung in TinySesamConfig:
#   forward_auth_enabled=True
#   base_url="https://example.com"      # derselbe Host wie die Site
#   cookie_domain=""                    # host-only reicht — es ist nur ein Host
#   trusted_proxies=["127.0.0.1/32"]
# trusted_redirect_hosts braucht es hier NICHT: der Host der eigenen base_url ist immer ein
# erlaubtes next=-Ziel.
#
# ── Drei Fallen, die dieser Zuschnitt aufstellt ──────────────────────────────────────────────
#  (1) `location ^~ /intern/` schaltet die REGEX-Locations des Servers ab. Ein serverweites
#      `location ~ /\.` greift dort nicht mehr — .env und .git würden ausgerechnet im
#      geschützten Ordner ausgeliefert. Deshalb steht die Punktdatei-Sperre unten NOCH EINMAL
#      innerhalb des geschützten Blocks.
#  (2) `proxy_set_header Remote-User` erreicht PHP-FPM nicht. FastCGI kennt keine Proxy-Header;
#      es braucht `fastcgi_param HTTP_REMOTE_USER` (in PHP dann $_SERVER['HTTP_REMOTE_USER']).
#  (3) Die Remote-*-Header müssen auch in den OFFENEN Locations gesetzt (geleert) werden, sonst
#      schickt ein Client sie einfach selbst mit und die App glaubt ihm.
#
# Alle drei sind nachgestellt (nginx 1.31 + php-fpm 8.3): ohne (1) liefert /intern/.env eine 200
# mit Inhalt, ohne (2) bleibt HTTP_REMOTE_USER in PHP leer, ohne (3) kommt ein mitgeschickter
# `Remote-User: root` als $_SERVER['HTTP_REMOTE_USER'] an.

# ── TinySesam-Cookies nicht an die App (B-20) ────────────────────────────────────────────────
# Der Browser schickt das Sitzungs-Cookie (und das Freigabe-Cookie tinysesam_runlock) an jeden
# Host unter cookie_domain. Ungefiltert las es jede geschützte App mit: Eine kompromittierte
# oder schlicht geschwätzige App (Debug-Seite, Fehlerbericht, Log mit Anfrage-Headern) gab damit
# eine Sitzung heraus, die für ALLE Apps und das Konto bei TinySesam gilt. Die App braucht keins
# davon — wer angemeldet ist, sagen ihr die Remote-*-Header.
# nginx kann in einem Header nicht „alle Vorkommen ersetzen"; jede Stufe unten nimmt EIN
# `tinysesam_*`-Cookie (auch mit __Host-/__Secure-Präfix) heraus, sechs Stufen decken alle sechs
# Namen ab, die TinySesam setzt. Die letzte Stufe entfernt ein übrig gebliebenes führendes `; `.
# Andere Cookies bleiben unberührt. Umbenannte Cookies (session_cookie=…, resource_cookie=…,
# csrf_cookie=…) müssen hier ins Muster. `map` steht im http-Kontext — diese Datei wird wie
# üblich aus conf.d/ in http{} eingebunden; die Variablennamen dürfen nur einmal vorkommen.
map $http_cookie $ts_ck1 { "~^(?<ts1a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts1b>.*)$" "$ts1a$ts1b"; default $http_cookie; }
map $ts_ck1 $ts_ck2 { "~^(?<ts2a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts2b>.*)$" "$ts2a$ts2b"; default $ts_ck1; }
map $ts_ck2 $ts_ck3 { "~^(?<ts3a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts3b>.*)$" "$ts3a$ts3b"; default $ts_ck2; }
map $ts_ck3 $ts_ck4 { "~^(?<ts4a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts4b>.*)$" "$ts4a$ts4b"; default $ts_ck3; }
map $ts_ck4 $ts_ck5 { "~^(?<ts5a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts5b>.*)$" "$ts5a$ts5b"; default $ts_ck4; }
map $ts_ck5 $ts_ck6 { "~^(?<ts6a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts6b>.*)$" "$ts6a$ts6b"; default $ts_ck5; }
map $ts_ck6 $ts_app_cookie { "~^[;\s]+(?<tsrest>.*)$" "$tsrest"; default $ts_ck6; }

server {
    listen 443 ssl;
    server_name example.com;
    root /var/www/example;
    index index.php index.html;

    # ── Interner Sub-Request an TinySesam ───────────────────────────────────────────────────
    location = /auth/forward {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;   # nicht den des Clients (s. nginx.conf)
        proxy_set_header Cookie $http_cookie;
    }

    # Variante mit Rollenzwang: eigener interner Endpunkt je Rolle. Der Query-String steht in
    # DIESER Datei, nicht beim Client — nginx hängt den Client-Query an einen Sub-Request nicht
    # an. TinySesam antwortet 403 (nicht 401), wenn angemeldet ist, aber die Rolle fehlt.
    location = /auth/forward-redaktion {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward?roles=redaktion,admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;   # nicht den des Clients (s. nginx.conf)
        proxy_set_header Cookie $http_cookie;
    }

    # ── TinySesam selbst (Login-Seite, Callbacks, Konto) — muss offen erreichbar sein ────────
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ── Geschützter Ordner ──────────────────────────────────────────────────────────────────
    location ^~ /intern/ {
        auth_request /auth/forward;
        # …oder mit Rollenzwang:  auth_request /auth/forward-redaktion;

        auth_request_set $ts_user   $upstream_http_remote_user;
        auth_request_set $ts_name   $upstream_http_remote_name;
        auth_request_set $ts_email  $upstream_http_remote_email;
        auth_request_set $ts_groups $upstream_http_remote_groups;
        auth_request_set $ts_login  $upstream_http_x_tinysesam_location;
        error_page 401 = @tinysesam_login;
        # 403 = angemeldet, aber Rolle fehlt. NICHT zum Login schicken (dort ändert sich nichts).
        error_page 403 = @tinysesam_denied;

        # (1) Punktdateien: hier wiederholen, weil ^~ die Regex-Locations abschaltet.
        location ~ /\. { deny all; }

        # PHP im geschützten Ordner
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            # (2) FastCGI statt proxy_set_header — sonst bleibt die Variable in PHP still leer.
            fastcgi_param HTTP_REMOTE_USER   $ts_user;
            fastcgi_param HTTP_REMOTE_NAME   $ts_name;
            fastcgi_param HTTP_REMOTE_EMAIL  $ts_email;
            fastcgi_param HTTP_REMOTE_GROUPS $ts_groups;
            # Ohne die TinySesam-Cookies (B-20, map oben) — PHP braucht sie nicht.
            fastcgi_param HTTP_COOKIE        $ts_app_cookie;
        }
    }

    # ── Offener Rest ────────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        # (3) Hier LEEREN: ohne diese vier Zeilen kann ein Client "Remote-User: admin" einfach
        # selbst mitschicken, und PHP sähe es als $_SERVER['HTTP_REMOTE_USER'].
        fastcgi_param HTTP_REMOTE_USER   "";
        fastcgi_param HTTP_REMOTE_NAME   "";
        fastcgi_param HTTP_REMOTE_EMAIL  "";
        fastcgi_param HTTP_REMOTE_GROUPS "";
        # Auch hier ohne die TinySesam-Cookies (B-20): Derselbe Host heisst, der Browser schickt
        # sie auch an jedes offene Skript — und das ist oft das am wenigsten gepflegte.
        fastcgi_param HTTP_COOKIE        $ts_app_cookie;
    }

    location @tinysesam_login  { return 302 $ts_login; }
    location @tinysesam_denied { return 403 "Kein Zugriff: fehlende Rolle."; }
}
