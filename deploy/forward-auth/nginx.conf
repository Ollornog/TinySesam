# TinySesam forward-auth with nginx (auth_request).
#
# Prerequisite in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (see the Caddyfile comment).
#
# This layout protects a whole host and forwards to an app on :9000. For the
# other common case — ONE host, only individual paths protected, static files
# and PHP behind it — see nginx-pfad.conf; it brings three traps of its own.
#
# Require roles (optional): `proxy_pass http://127.0.0.1:8000/auth/forward?roles=redaktion,admin;`
# — then TinySesam answers 403 when someone is signed in but lacks the role. The query
# is in this file; nginx does not append the client's query to a sub-request.

# ── TinySesam cookies must not reach the app (B-20) ──────────────────────────────────────────
# The browser sends the session cookie (and the approval cookie tinysesam_runlock) to every
# host under cookie_domain. Unfiltered, every protected app read it along: a compromised
# or simply chatty app (debug page, error report, log with request headers) thereby leaked
# a session valid for ALL apps and the account at TinySesam. The app needs neither
# of them — who is signed in is told to it by the Remote-* headers.
# nginx cannot "replace all occurrences" in a header; each stage below removes ONE
# `tinysesam_*` cookie (also with the __Host-/__Secure- prefix). How many a browser carries
# is not fixed: after the switch to `__Host-` the old names sit alongside until they expire
# or TinySesam deletes them at the next sign-in; plus flow cookies of sign-ins in progress
# and renamed cookies of several instances. The chain is therefore long enough for every name
# twice over, and behind it sits a latch: if a tinysesam cookie is STILL left afterwards, no
# cookie at all goes to the app (fail closed) — better that in this edge case it loses its own
# cookies than that a session slips through. The last stage removes a leftover
# leading `; `. To add stages: append a line following the pattern, move the latch onto it.
# Other cookies stay untouched. Renamed cookies (session_cookie=…, resource_cookie=…,
# csrf_cookie=…) must be added to the pattern here. `map` belongs in the http context — this file is
# included from conf.d/ into http{} as usual; the variable names may occur only once.
map $http_cookie $ts_ck1 { "~^(?<ts1a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts1b>.*)$" "$ts1a$ts1b"; default $http_cookie; }
map $ts_ck1 $ts_ck2 { "~^(?<ts2a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts2b>.*)$" "$ts2a$ts2b"; default $ts_ck1; }
map $ts_ck2 $ts_ck3 { "~^(?<ts3a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts3b>.*)$" "$ts3a$ts3b"; default $ts_ck2; }
map $ts_ck3 $ts_ck4 { "~^(?<ts4a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts4b>.*)$" "$ts4a$ts4b"; default $ts_ck3; }
map $ts_ck4 $ts_ck5 { "~^(?<ts5a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts5b>.*)$" "$ts5a$ts5b"; default $ts_ck4; }
map $ts_ck5 $ts_ck6 { "~^(?<ts6a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts6b>.*)$" "$ts6a$ts6b"; default $ts_ck5; }
map $ts_ck6 $ts_ck7 { "~^(?<ts7a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts7b>.*)$" "$ts7a$ts7b"; default $ts_ck6; }
map $ts_ck7 $ts_ck8 { "~^(?<ts8a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts8b>.*)$" "$ts8a$ts8b"; default $ts_ck7; }
map $ts_ck8 $ts_ck9 { "~^(?<ts9a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts9b>.*)$" "$ts9a$ts9b"; default $ts_ck8; }
map $ts_ck9 $ts_ck10 { "~^(?<ts10a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts10b>.*)$" "$ts10a$ts10b"; default $ts_ck9; }
map $ts_ck10 $ts_ck11 { "~^(?<ts11a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts11b>.*)$" "$ts11a$ts11b"; default $ts_ck10; }
map $ts_ck11 $ts_ck12 { "~^(?<ts12a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts12b>.*)$" "$ts12a$ts12b"; default $ts_ck11; }
map $ts_ck12 $ts_ck_zu { "~^(?:.*;\s*)?(?:__Host-|__Secure-)?tinysesam_[^=;]*=" ""; default $ts_ck12; }
map $ts_ck_zu $ts_app_cookie { "~^[;\s]+(?<tsrest>.*)$" "$tsrest"; default $ts_ck_zu; }

server {
    listen 443 ssl;
    server_name app.example.com;

    # Internal sub-request to TinySesam
    location = /auth/forward {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        # nginx sets the client IP, not the client (NEU-1). Without this line nginx passes
        # an X-Forwarded-For sent by the client through unchanged — and because nginx is in
        # trusted_proxies, TinySesam believes it: rate limit, IP lockout and the IP in the
        # security log (fail2ban!) were determined by the requester. Overwrite instead of append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /auth/forward;

        # Pass the auth response headers on to the upstream app. If they are named differently
        # (TinySesamConfig(forward_headers={...}), e.g. X-WEBAUTH-USER for Grafana), carry along
        # both the $upstream_http_* name and the header being set here.
        #
        # Set ALL FOUR, even if the app reads only two of them. A header not set here
        # is not simply omitted — nginx passes the CLIENT's one through to the
        # app unchanged. Remote-Name was missing until 2026-09-21: whoever sent `Remote-Name: chef`
        # had it delivered behind the auth check, as if it came from TinySesam. The list
        # must therefore cover TinySesam.FORWARD_HEADERS_DEFAULT completely.
        auth_request_set $user  $upstream_http_remote_user;
        auth_request_set $name  $upstream_http_remote_name;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $email $upstream_http_remote_email;
        auth_request_set $uid   $upstream_http_remote_id;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email $email;
        proxy_set_header Remote-Id $uid;

        # on 401 → redirect to the login URL from the header
        auth_request_set $login $upstream_http_x_tinysesam_location;
        error_page 401 = @tinysesam_login;

        # Without the TinySesam cookies (B-20, map above). The sub-request to /auth/forward keeps
        # them — there they are the credential.
        proxy_set_header Cookie $ts_app_cookie;
        proxy_pass http://127.0.0.1:9000;   # the actual app
    }

    location @tinysesam_login {
        return 302 $login;
    }
}
