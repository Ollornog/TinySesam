# TinySesam Forward-Auth mit nginx (auth_request).
#
# Voraussetzung in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (siehe Caddyfile-Kommentar).
#
# Dieser Zuschnitt schützt einen ganzen Host und reicht an eine App auf :9000 weiter. Für den
# anderen verbreiteten Fall — EIN Host, nur einzelne Pfade geschützt, dahinter statische Dateien
# und PHP — siehe nginx-pfad.conf; der bringt drei eigene Fallen mit.
#
# Rollen verlangen (optional): `proxy_pass http://127.0.0.1:8000/auth/forward?roles=redaktion,admin;`
# — dann antwortet TinySesam 403, wenn jemand angemeldet ist, aber die Rolle fehlt. Der Query
# steht in dieser Datei; den Query des Clients hängt nginx an einen Sub-Request nicht an.

# ── TinySesam-Cookies nicht an die App (B-20) ────────────────────────────────────────────────
# Der Browser schickt das Sitzungs-Cookie (und das Freigabe-Cookie tinysesam_runlock) an jeden
# Host unter cookie_domain. Ungefiltert las es jede geschützte App mit: Eine kompromittierte
# oder schlicht geschwätzige App (Debug-Seite, Fehlerbericht, Log mit Anfrage-Headern) gab damit
# eine Sitzung heraus, die für ALLE Apps und das Konto bei TinySesam gilt. Die App braucht keins
# davon — wer angemeldet ist, sagen ihr die Remote-*-Header.
# nginx kann in einem Header nicht „alle Vorkommen ersetzen"; jede Stufe unten nimmt EIN
# `tinysesam_*`-Cookie (auch mit __Host-/__Secure-Präfix) heraus. Wie viele ein Browser trägt,
# steht nicht fest: Nach dem Umstieg auf `__Host-` liegen die Altnamen daneben, bis sie ablaufen
# oder TinySesam sie beim nächsten Anmelden löscht; dazu Flow-Cookies angefangener Anmeldungen
# und umbenannte Cookies mehrerer Instanzen. Die Kette ist deshalb lang genug für jeden Namen
# doppelt, und dahinter steht ein Riegel: Bleibt danach NOCH ein tinysesam-Cookie übrig, geht
# gar kein Cookie an die App (fail closed) — lieber verliert sie in diesem Grenzfall ihre eigenen
# Cookies, als dass eine Sitzung durchrutscht. Die letzte Stufe entfernt ein übrig gebliebenes
# führendes `; `. Stufen nachrüsten: eine Zeile nach dem Muster anhängen, den Riegel auf sie umhängen.
# Andere Cookies bleiben unberührt. Umbenannte Cookies (session_cookie=…, resource_cookie=…,
# csrf_cookie=…) müssen hier ins Muster. `map` steht im http-Kontext — diese Datei wird wie
# üblich aus conf.d/ in http{} eingebunden; die Variablennamen dürfen nur einmal vorkommen.
map $http_cookie $ts_ck1 { "~^(?<ts1a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts1b>.*)$" "$ts1a$ts1b"; default $http_cookie; }
map $ts_ck1 $ts_ck2 { "~^(?<ts2a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts2b>.*)$" "$ts2a$ts2b"; default $ts_ck1; }
map $ts_ck2 $ts_ck3 { "~^(?<ts3a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts3b>.*)$" "$ts3a$ts3b"; default $ts_ck2; }
map $ts_ck3 $ts_ck4 { "~^(?<ts4a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts4b>.*)$" "$ts4a$ts4b"; default $ts_ck3; }
map $ts_ck4 $ts_ck5 { "~^(?<ts5a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts5b>.*)$" "$ts5a$ts5b"; default $ts_ck4; }
map $ts_ck5 $ts_ck6 { "~^(?<ts6a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts6b>.*)$" "$ts6a$ts6b"; default $ts_ck5; }
map $ts_ck6 $ts_ck7 { "~^(?<ts7a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts7b>.*)$" "$ts7a$ts7b"; default $ts_ck6; }
map $ts_ck7 $ts_ck8 { "~^(?<ts8a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts8b>.*)$" "$ts8a$ts8b"; default $ts_ck7; }
map $ts_ck8 $ts_ck9 { "~^(?<ts9a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts9b>.*)$" "$ts9a$ts9b"; default $ts_ck8; }
map $ts_ck9 $ts_ck10 { "~^(?<ts10a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts10b>.*)$" "$ts10a$ts10b"; default $ts_ck9; }
map $ts_ck10 $ts_ck11 { "~^(?<ts11a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts11b>.*)$" "$ts11a$ts11b"; default $ts_ck10; }
map $ts_ck11 $ts_ck12 { "~^(?<ts12a>.*?)(?:^|;\s*)(?:__Host-|__Secure-)?tinysesam_[^=;]*=[^;]*(?<ts12b>.*)$" "$ts12a$ts12b"; default $ts_ck11; }
map $ts_ck12 $ts_ck_zu { "~^(?:.*;\s*)?(?:__Host-|__Secure-)?tinysesam_[^=;]*=" ""; default $ts_ck12; }
map $ts_ck_zu $ts_app_cookie { "~^[;\s]+(?<tsrest>.*)$" "$tsrest"; default $ts_ck_zu; }

server {
    listen 443 ssl;
    server_name app.example.com;

    # Interner Sub-Request an TinySesam
    location = /auth/forward {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        # Die Client-IP setzt nginx, nicht der Client (NEU-1). Ohne diese Zeile reicht nginx
        # einen vom Client mitgeschickten X-Forwarded-For unverändert durch — und weil nginx in
        # trusted_proxies steht, glaubt TinySesam ihm: Rate-Limit, IP-Sperre und die IP im
        # Sicherheits-Log (fail2ban!) bestimmte der Anfragende. Überschreiben statt anhängen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /auth/forward;

        # Auth-Antwort-Header an die Upstream-App durchreichen. Heissen sie anders
        # (TinySesamConfig(forward_headers={...}), z.B. X-WEBAUTH-USER für Grafana), dann hier
        # sowohl den $upstream_http_*-Namen als auch den gesetzten Header mitziehen.
        #
        # ALLE VIER setzen, auch wenn die App nur zwei davon liest. Ein hier nicht gesetzter
        # Header wird nicht etwa weggelassen — nginx reicht den des CLIENTS unverändert an die
        # App durch. Remote-Name fehlte bis 2026-09-21: Wer `Remote-Name: chef` mitschickte,
        # bekam ihn hinter der Auth-Prüfung zugestellt, als käme er von TinySesam. Die Liste
        # muss also TinySesam.FORWARD_HEADERS_DEFAULT vollständig abdecken.
        auth_request_set $user  $upstream_http_remote_user;
        auth_request_set $name  $upstream_http_remote_name;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $email $upstream_http_remote_email;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email $email;

        # bei 401 → Redirect zur Login-URL aus dem Header
        auth_request_set $login $upstream_http_x_tinysesam_location;
        error_page 401 = @tinysesam_login;

        # Ohne die TinySesam-Cookies (B-20, map oben). Der Sub-Request an /auth/forward behält
        # sie — dort sind sie der Ausweis.
        proxy_set_header Cookie $ts_app_cookie;
        proxy_pass http://127.0.0.1:9000;   # eigentliche App
    }

    location @tinysesam_login {
        return 302 $login;
    }
}
