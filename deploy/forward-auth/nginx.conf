# TinySesam Forward-Auth mit nginx (auth_request).
#
# Voraussetzung in TinySesamConfig: forward_auth_enabled=True, base_url, cookie_domain,
# trusted_redirect_hosts, trusted_proxies (siehe Caddyfile-Kommentar).
#
# Dieser Zuschnitt schützt einen ganzen Host und reicht an eine App auf :9000 weiter. Für den
# anderen verbreiteten Fall — EIN Host, nur einzelne Pfade geschützt, dahinter statische Dateien
# und PHP — siehe nginx-pfad.conf; der bringt drei eigene Fallen mit.
#
# Rollen verlangen (optional): `proxy_pass http://127.0.0.1:8000/auth/forward?roles=redaktion,admin;`
# — dann antwortet TinySesam 403, wenn jemand angemeldet ist, aber die Rolle fehlt. Der Query
# steht in dieser Datei; den Query des Clients hängt nginx an einen Sub-Request nicht an.

server {
    listen 443 ssl;
    server_name app.example.com;

    # Interner Sub-Request an TinySesam
    location = /auth/forward {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/forward;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /auth/forward;

        # Auth-Antwort-Header an die Upstream-App durchreichen. Heissen sie anders
        # (TinySesamConfig(forward_headers={...}), z.B. X-WEBAUTH-USER für Grafana), dann hier
        # sowohl den $upstream_http_*-Namen als auch den gesetzten Header mitziehen.
        #
        # ALLE VIER setzen, auch wenn die App nur zwei davon liest. Ein hier nicht gesetzter
        # Header wird nicht etwa weggelassen — nginx reicht den des CLIENTS unverändert an die
        # App durch. Remote-Name fehlte bis 2026-09-21: Wer `Remote-Name: chef` mitschickte,
        # bekam ihn hinter der Auth-Prüfung zugestellt, als käme er von TinySesam. Die Liste
        # muss also TinySesam.FORWARD_HEADERS_DEFAULT vollständig abdecken.
        auth_request_set $user  $upstream_http_remote_user;
        auth_request_set $name  $upstream_http_remote_name;
        auth_request_set $groups $upstream_http_remote_groups;
        auth_request_set $email $upstream_http_remote_email;
        proxy_set_header Remote-User $user;
        proxy_set_header Remote-Name $name;
        proxy_set_header Remote-Groups $groups;
        proxy_set_header Remote-Email $email;

        # bei 401 → Redirect zur Login-URL aus dem Header
        auth_request_set $login $upstream_http_x_tinysesam_location;
        error_page 401 = @tinysesam_login;

        proxy_pass http://127.0.0.1:9000;   # eigentliche App
    }

    location @tinysesam_login {
        return 302 $login;
    }
}
