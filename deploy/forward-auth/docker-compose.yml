# TinySesam als OIDC-Forward-Auth-Gateway (deploy-and-go), zusammen mit Caddy.
#
#   docker compose up -d
#
# Caddy ruft je Request GET /auth/forward beim Gateway (siehe ./Caddyfile). Der Gateway macht
# ausschließlich OIDC-Login + Forward-Auth (keine Passwörter/PIN/Konten). Nötig ist das Extra
# [gateway] — das ist [oidc] PLUS einen ASGI-Server. Wer nur [oidc] nimmt, bekommt die Bibliothek
# ohne Server und der Start endet in `ModuleNotFoundError: uvicorn`. Im Abbild unten ist das
# erledigt; die Zeile zählt für alle, die den Gateway ohne Container fahren.
#
# Das Abbild ist GEPINNT. Vorher stand hier ein `pip install` ohne Ref: damit zog jeder
# Neustart den aktuellen Hauptzweig — zwei Container derselben Datei konnten verschiedene
# Versionen fahren, ohne Netz startete gar nichts, und ein Rollback gab es nicht.
#
# Aktualisieren = Abbild-Tag hochziehen, `docker compose pull && docker compose up -d`.
# Rollback = alten Tag zurückschreiben. Wer es ernst meint, pinnt den Digest
# (`ghcr.io/ollornog/tinysesam@sha256:…`) — ein Tag lässt sich umhängen, ein Digest nicht.
# Der Digest steht im Log des release-Workflows. Es gibt bewusst kein `latest`.
#
# Caddy ist der Netzrand — der einzige Dienst, der aus dem Internet erreichbar ist. Bis 0.19.0
# stand hier `caddy:2`: ein Tag, der mit jeder Caddy-Version wandert, sodass zwei `pull` desselben
# Compose zwei verschiedene Proxys ergaben (B4-11 aus T-13). Jetzt Version UND Digest; Dependabot
# hebt beides (Eintrag `docker-compose` in .github/dependabot.yml). Das eigene Abbild bleibt beim
# Versions-Tag: Sein Digest entsteht erst im Release, also nach dem Commit, der ihn nennen müsste.
#
# Beide Dienste laufen gehärtet (`x-haertung` unten): Dateisystem nur lesbar, alle Capabilities
# weg, kein Rechtegewinn über setuid. Geschrieben wird nur in die Volumes und in ein tmpfs.
# `tests/test_repo.py` verlangt das für jeden Dienst dieser Datei.

x-haertung: &haertung
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  tinysesam:
    <<: *haertung
    image: ghcr.io/ollornog/tinysesam:v0.20.0
    # Kein `command:` nötig — der Entrypoint startet das Gateway. Es läuft als Nicht-root
    # (uid 1000) und bringt einen HEALTHCHECK auf /healthz mit.
    environment:
      TINYSESAM_OIDC_ISSUER: "https://id.example.com"
      TINYSESAM_OIDC_CLIENT_ID: "gateway"
      TINYSESAM_OIDC_CLIENT_SECRET: "CHANGE_ME"
      TINYSESAM_BASE_URL: "https://auth.example.com"
      TINYSESAM_COOKIE_DOMAIN: ".example.com"
      TINYSESAM_PROTECTED_HOSTS: "app.example.com,wiki.example.com"
      # Wer durch das Tor darf, muss IRGENDWO begrenzt sein — sonst kommt jedes Konto beim
      # Provider in jede Anwendung (deny-by-default, B3-9). Hier geschieht das über die
      # Freigabe je Client beim Provider (TINYSESAM_OIDC_CLIENTS unten). Wer nur EINEN Client
      # fährt, begrenzt mit Gruppen; ohne beides warnt TinySesam beim Start.
      # TINYSESAM_ALLOWED_GROUPS: "mitarbeiter"
      #
      # Zwei Anwendungen, zwei Clients, EINE Installation (T-14). Wer in welche darf, steht
      # beim Provider — dort hängt die Freigabe am Client. Ohne eigene Clients gäbe es nur eine
      # Antwort für beide: Wer in app darf, käme auch ins wiki.
      TINYSESAM_OIDC_CLIENTS: >-
        {"app.example.com":  {"client_id": "app",  "client_secret": "CHANGE_ME_APP"},
         "wiki.example.com": {"client_id": "wiki", "client_secret": "CHANGE_ME_WIKI"}}
      # Dieselbe Angabe einzeln — praktisch, wenn die Geheimnisse aus einer Datei oder einem
      # Secret-Store kommen. Der Hostname wird gegen PROTECTED_HOSTS abgeglichen, ein
      # Unterstrich kann also auch für einen Bindestrich stehen:
      #   TINYSESAM_OIDC_CLIENT_APP_EXAMPLE_COM_ID: "app"
      #   TINYSESAM_OIDC_CLIENT_APP_EXAMPLE_COM_SECRET: "CHANGE_ME_APP"
      #
      # Nach dieser Frist fragt das Gateway beim Provider nach, ob die Freigabe noch gilt.
      # 0 schaltet das ab — dann wirkt ein Gruppenentzug dort erst, wenn die Sitzung abläuft.
      TINYSESAM_OIDC_REVALIDATE_MINUTES: "60"
      # Das Netz unten, NICHT 0.0.0.0/0: Gilt jede Adresse als Proxy, bleibt keine als Client
      # übrig — X-Forwarded-For wird dann wirkungslos statt großzügig, und alle Nutzer erscheinen
      # unter der Caddy-IP. Rate-Limit und IP-Sperre wirken ab da kollektiv, und fail2ban bannt
      # im Ernstfall den Proxy, also alle. Deshalb hat dieses Compose ein festes Subnetz: eine
      # vom Docker-Daemon vergebene Bridge-Adresse könnte man hier gar nicht eintragen.
      TINYSESAM_TRUSTED_PROXIES: "172.28.0.0/16"
      TINYSESAM_HTTPS_MODE: "warn"                     # TLS terminiert Caddy davor
      TINYSESAM_DB: "/data/gateway.db"
      # Das Lesefutter für fail2ban. Ohne diese Zeile UND den Mount unten zeigt die
      # mitgelieferte Jail (deploy/fail2ban/) auf eine Datei, die es nie gibt — sie meldet sich
      # nicht, sie läuft still leer. Zwei mitgelieferte Bausteine, die zusammen nichts tun.
      TINYSESAM_SECURITY_LOG: "/var/log/tinysesam/security.log"
      TINYSESAM_PORT: "8000"
    volumes:
      - tinysesam-data:/data
      # Auf den HOST, nicht in ein Volume: fail2ban läuft dort und muss die Datei lesen können.
      # Das Verzeichnis vorher anlegen und dem Dienstbenutzer geben:
      #   sudo install -d -o 1000 -g 1000 /var/log/tinysesam
      - /var/log/tinysesam:/var/log/tinysesam
    networks: [intern]
    restart: unless-stopped

  caddy:
    <<: *haertung
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    # Die einzige Capability, die zurückkommt: Ports unter 1024 binden (80/443).
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Die Caddyfile zeigt ohne diese beiden auf 127.0.0.1 — im Caddy-CONTAINER wäre das der
      # Container selbst, wo nichts lauscht. Hier gelten die Service-Namen des Compose-Netzes.
      # (Die App unten ist ein Platzhalter: eigenen Service eintragen.)
      TS_AUTH_UPSTREAM: "tinysesam:8000"
      TS_APP_UPSTREAM: "app:9000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tinysesam
    networks: [intern]
    restart: unless-stopped

networks:
  intern:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  tinysesam-data:
  caddy-data:
  caddy-config:
