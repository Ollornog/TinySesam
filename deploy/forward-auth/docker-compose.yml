# TinySesam als OIDC-Forward-Auth-Gateway (deploy-and-go), zusammen mit Caddy.
#
#   docker compose up -d
#
# Caddy ruft je Request GET /auth/forward beim Gateway (siehe ./Caddyfile). Der Gateway macht
# ausschließlich OIDC-Login + Forward-Auth (keine Passwörter/PIN/Konten). Nur [oidc]-Extra nötig.
#
# Das Abbild ist GEPINNT. Vorher stand hier ein `pip install` ohne Ref: damit zog jeder
# Neustart den aktuellen Hauptzweig — zwei Container derselben Datei konnten verschiedene
# Versionen fahren, ohne Netz startete gar nichts, und ein Rollback gab es nicht.
#
# Aktualisieren = Abbild-Tag hochziehen, `docker compose pull && docker compose up -d`.
# Rollback = alten Tag zurückschreiben. Wer es ernst meint, pinnt den Digest
# (`ghcr.io/ollornog/tinysesam@sha256:…`) — ein Tag lässt sich umhängen, ein Digest nicht.
# Der Digest steht im Log des release-Workflows. Es gibt bewusst kein `latest`.

services:
  tinysesam:
    image: ghcr.io/ollornog/tinysesam:v0.18.0
    # Kein `command:` nötig — der Entrypoint startet das Gateway. Es läuft als Nicht-root
    # (uid 1000) und bringt einen HEALTHCHECK auf /healthz mit.
    environment:
      TINYSESAM_OIDC_ISSUER: "https://id.example.com"
      TINYSESAM_OIDC_CLIENT_ID: "gateway"
      TINYSESAM_OIDC_CLIENT_SECRET: "CHANGE_ME"
      TINYSESAM_BASE_URL: "https://auth.example.com"
      TINYSESAM_COOKIE_DOMAIN: ".example.com"
      TINYSESAM_PROTECTED_HOSTS: "app.example.com,wiki.example.com"
      # TINYSESAM_ALLOWED_GROUPS: "mitarbeiter"       # optional: nur diese OIDC-Gruppen
      # Das Netz unten, NICHT 0.0.0.0/0: Gilt jede Adresse als Proxy, bleibt keine als Client
      # übrig — X-Forwarded-For wird dann wirkungslos statt großzügig, und alle Nutzer erscheinen
      # unter der Caddy-IP. Rate-Limit und IP-Sperre wirken ab da kollektiv, und fail2ban bannt
      # im Ernstfall den Proxy, also alle. Deshalb hat dieses Compose ein festes Subnetz: eine
      # vom Docker-Daemon vergebene Bridge-Adresse könnte man hier gar nicht eintragen.
      TINYSESAM_TRUSTED_PROXIES: "172.28.0.0/16"
      TINYSESAM_HTTPS_MODE: "warn"                     # TLS terminiert Caddy davor
      TINYSESAM_DB: "/data/gateway.db"
      # Das Lesefutter für fail2ban. Ohne diese Zeile UND den Mount unten zeigt die
      # mitgelieferte Jail (deploy/fail2ban/) auf eine Datei, die es nie gibt — sie meldet sich
      # nicht, sie läuft still leer. Zwei mitgelieferte Bausteine, die zusammen nichts tun.
      TINYSESAM_SECURITY_LOG: "/var/log/tinysesam/security.log"
      TINYSESAM_PORT: "8000"
    volumes:
      - tinysesam-data:/data
      # Auf den HOST, nicht in ein Volume: fail2ban läuft dort und muss die Datei lesen können.
      # Das Verzeichnis vorher anlegen und dem Dienstbenutzer geben:
      #   sudo install -d -o 1000 -g 1000 /var/log/tinysesam
      - /var/log/tinysesam:/var/log/tinysesam
    networks: [intern]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - tinysesam
    networks: [intern]
    restart: unless-stopped

networks:
  intern:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  tinysesam-data:
  caddy-data:
  caddy-config:
